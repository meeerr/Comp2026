<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COMPILATION | The Bakery</title>
<!-- Firebase App (The Bakery Backend) -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

<style>
  :root {
    --theme-color: #00ffff;
    --bg-color: #05010a;
    --panel-bg: rgba(5, 2, 10, 0.25);
    --text-color: #ffffff;
  }

  /* STARTUP ANIMATION */
  #boot-screen {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: #000;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: 'Courier New', monospace;
  }
  .boot-text {
    color: var(--theme-color);
    font-size: 1.2rem;
    overflow: hidden;
    white-space: nowrap;
    border-right: 2px solid var(--theme-color);
    animation: typing 1s steps(20, end), blink .5s step-end infinite;
  }
  @keyframes typing { from { width: 0 } to { width: 100% } }
  @keyframes blink { from, to { border-color: transparent } 50% { border-color: var(--theme-color); } }

  body {
    margin: 0; padding: 0; width: 100vw; height: 100vh;
    font-family: 'Courier New', Courier, monospace;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background-color: var(--bg-color);
    overflow: hidden; color: var(--text-color);
    perspective: 1200px; cursor: crosshair; user-select: none;
  }

  #canvas-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
  .scanlines {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
    background-size: 100% 4px; pointer-events: none; z-index: 1;
  }

  .glass-panel {
    position: relative; z-index: 2;
    background: var(--panel-bg); 
    backdrop-filter: blur(12px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px; padding: 40px; width: 750px; max-width: 90%;
    display: flex; flex-direction: column; align-items: center;
    box-shadow: 0 30px 60px rgba(0,0,0,0.9);
  }

  h1 { margin: 0; font-weight: 900; letter-spacing: 12px; font-size: 3.5rem; text-shadow: 0 0 15px var(--theme-color); }

  /* THEMES NAV */
  .theme-selector {
    display: flex; gap: 10px; margin-bottom: 20px; z-index: 5;
  }
  .theme-dot {
    width: 20px; height: 20px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; transition: transform 0.2s;
  }
  .theme-dot:hover { transform: scale(1.3); }

  /* CHAT: THE BAKERY */
  #bakery-chat {
    position: fixed; bottom: 20px; right: 20px; width: 300px; height: 400px;
    background: rgba(0,0,0,0.8); border: 1px solid var(--theme-color);
    border-radius: 8px; display: flex; flex-direction: column; z-index: 100;
    box-shadow: 0 0 20px var(--theme-color);
    transition: transform 0.3s ease;
  }
  .chat-header { background: var(--theme-color); color: #000; padding: 5px 10px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; }
  #chat-messages { flex: 1; overflow-y: auto; padding: 10px; font-size: 12px; display: flex; flex-direction: column; gap: 5px; }
  .chat-input-area { display: flex; border-top: 1px solid #444; }
  #chat-input { background: transparent; border: none; color: white; padding: 10px; flex: 1; outline: none; }
  
  .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; width: 100%; margin-top: 20px; }
  .place-btn {
    background: rgba(0, 0, 0, 0.6); border: 1px solid var(--theme-color);
    color: #e0e0e0; padding: 18px; font-size: 18px; font-weight: bold;
    cursor: crosshair; border-radius: 8px; transition: all 0.3s;
  }
  .place-btn:hover { background: var(--theme-color); color: #000; box-shadow: 0 0 20px var(--theme-color); }
  
  .minimized { transform: translateY(365px); }
</style>
</head>
<body>

  <div id="boot-screen">
    <div class="boot-text">INITIALIZING_COMPILATION...</div>
  </div>

  <canvas id="canvas-bg"></canvas>
  <div class="scanlines"></div>

  <div class="theme-selector">
    <div class="theme-dot" style="background:#00ffff" onclick="setTheme('cyber')"></div>
    <div class="theme-dot" style="background:#ff0044" onclick="setTheme('lava')"></div>
    <div class="theme-dot" style="background:#39ff14" onclick="setTheme('matrix')"></div>
    <div class="theme-dot" style="background:#ff00ff" onclick="setTheme('synth')"></div>
    <div class="theme-dot" style="background:#ffd700" onclick="setTheme('gold')"></div>
    <div class="theme-dot" style="background:#007fff" onclick="setTheme('deepsea')"></div>
  </div>

  <div class="glass-panel" id="tilt-panel">
    <h1>COMPILATION</h1>
    <div class="grid-container" id="menu"></div>
  </div>

  <!-- THE BAKERY CHAT -->
  <div id="bakery-chat" class="minimized">
    <div class="chat-header" onclick="toggleChat()">
      <span>THE BAKERY</span>
      <span id="chat-toggle-btn">+</span>
    </div>
    <div id="chat-messages"></div>
    <div class="chat-input-area">
      <input type="text" id="chat-input" placeholder="Say something..." maxlength="100">
    </div>
  </div>

  <script>
    // 1. STARTUP ANIMATION
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('boot-screen').style.opacity = '0';
        setTimeout(() => document.getElementById('boot-screen').remove(), 500);
      }, 1200);
    });

    // 2. THEMES CONFIG
    const themes = {
      cyber: { color: '#00ffff', bg: '#05010a' },
      lava: { color: '#ff0044', bg: '#0a0101' },
      matrix: { color: '#39ff14', bg: '#010a02' },
      synth: { color: '#ff00ff', bg: '#0a010a' },
      gold: { color: '#ffd700', bg: '#0a0801' },
      deepsea: { color: '#007fff', bg: '#01050a' }
    };

    function setTheme(name) {
      const t = themes[name];
      document.documentElement.style.setProperty('--theme-color', t.color);
      document.documentElement.style.setProperty('--bg-color', t.bg);
      globalHue = getHueFromHex(t.color);
    }

    function getHueFromHex(hex) {
        var r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
        var max = Math.max(r, g, b), min = Math.min(r, g, b);
        var h, s, l = (max + min) / 2;
        if(max == min){ h = s = 0; }
        else {
            var d = max - min;
            s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            switch(max){
                case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                case g: h = (b - r) / d + 2; break;
                case b: h = (r - g) / d + 4; break;
            }
            h /= 6;
        }
        return h * 360;
    }

    // 3. PLACES (Filtered to 04 and 05)
    const places = [
      { label: "PIE PLACE 04", hex: "68747470733a2f2f666f72742e726569646368616c66696e2e776f726b6572732e646576" },
      { label: "PIE PLACE 05", hex: "68747470733a2f2f676168323232322e6769746875622e696f2f4e6f6f62732f" }
    ];

    const menu = document.getElementById('menu');
    places.forEach(p => {
      const btn = document.createElement('button');
      btn.className = 'place-btn';
      btn.innerText = p.label;
      btn.onclick = () => {
        let u = '';
        for (let i = 0; i < p.hex.length; i += 2) u += String.fromCharCode(parseInt(p.hex.substr(i, 2), 16));
        window.open(u, '_blank');
      };
      menu.appendChild(btn);
    });

    // 4. THE BAKERY CHAT LOGIC
    function toggleChat() {
      const chat = document.getElementById('bakery-chat');
      const btn = document.getElementById('chat-toggle-btn');
      chat.classList.toggle('minimized');
      btn.innerText = chat.classList.contains('minimized') ? '+' : '-';
    }

    // --- FIREBASE CONFIGURATION ---
    // TO MAKE CHAT WORK: 
    // 1. Go to firebase.google.com, create a project.
    // 2. Enable "Realtime Database" and set rules to: { ".read": true, ".write": true } (for testing).
    // 3. Replace the config below with yours.
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      databaseURL: "YOUR_DATABASE_URL",
      projectId: "YOUR_PROJECT_ID",
    };

    // Only initialize if keys are provided
    if(firebaseConfig.apiKey !== "YOUR_API_KEY") {
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const chatRef = db.ref("messages");

        document.getElementById('chat-input').addEventListener('keypress', (e) => {
          if (e.key === 'Enter' && e.target.value.trim() !== "") {
            chatRef.push({
              msg: e.target.value,
              ts: Date.now()
            });
            e.target.value = "";
          }
        });

        chatRef.limitToLast(20).on("child_added", (snap) => {
          const data = snap.val();
          const div = document.createElement('div');
          div.innerHTML = `<span style="color:var(--theme-color)">[Anonymous]:</span> ${data.msg}`;
          const box = document.getElementById('chat-messages');
          box.appendChild(div);
          box.scrollTop = box.scrollHeight;
        });
    } else {
        document.getElementById('chat-messages').innerHTML = "Set up Firebase keys to enable The Bakery.";
    }

    // 5. PARTICLE SYSTEM (Original Physics Maintained)
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');
    let particlesArray = [];
    let globalHue = 180;
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;

    class Particle {
      constructor(x, y, vx, vy, size) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy;
        this.baseVx = vx; this.baseVy = vy; this.size = size;
      }
      update() {
        if (this.x > canvas.width || this.x < 0) this.vx = -this.vx;
        if (this.y > canvas.height || this.y < 0) this.vy = -this.vy;
        this.x += this.vx; this.y += this.vy;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `hsl(${globalHue}, 100%, 50%)`;
        ctx.fill();
      }
    }

    function init() {
      particlesArray = [];
      for (let i = 0; i < 100; i++) {
        particlesArray.push(new Particle(Math.random()*canvas.width, Math.random()*canvas.height, Math.random()*2-1, Math.random()*2-1, 2));
      }
    }

    function animate() {
      ctx.fillStyle = 'rgba(5, 1, 10, 0.2)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      particlesArray.forEach(p => p.update());
      requestAnimationFrame(animate);
    }
    init(); animate();
  </script>
</body>
</html>
