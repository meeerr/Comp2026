<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COMPILATION</title>
<!-- Rock-solid Realtime WebSockets for Cross-Device Global Chat -->
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
  :root {
    --theme-color: #00ffff;
    --theme-bg: #05010a;
    --panel-bg: rgba(5, 2, 10, 0.35);
    --cyan: #00e5ff;
    --lime: #39ff14;
    --gold: #ffd700;
    --orange: #ff6600;
    --hot-pink: #ff00aa;
    --electric-blue: #007fff;
    --magenta: #ff00ff;
    --bright-green: #32cd32;
    --neon-red: #ff073a;
    --forest-green: #228b22;
    --purple-haze: #7f00ff;
  }

  /* Distinct visual vibes for themes */
  body[data-theme="matrix"] {
    --theme-color: #39ff14;
    --theme-bg: #000a02;
    --panel-bg: rgba(0, 20, 5, 0.5);
  }
  body[data-theme="synthwave"] {
    --theme-color: #ff00aa;
    --theme-bg: #0d001a;
    --panel-bg: rgba(25, 0, 35, 0.45);
  }
  body[data-theme="blackhole"] {
    --theme-color: #ff7700;
    --theme-bg: #020205;
    --panel-bg: rgba(10, 5, 15, 0.45);
  }
  body[data-theme="cyberpunk"] {
    --theme-color: #00e5ff;
    --theme-bg: #040814;
    --panel-bg: rgba(2, 12, 28, 0.5);
  }
  body[data-theme="hyperspace"] {
    --theme-color: #7f00ff;
    --theme-bg: #010008;
    --panel-bg: rgba(8, 0, 20, 0.5);
  }
  body[data-theme="vapor"] {
    --theme-color: #ff71ce;
    --theme-bg: #0b001a;
    --panel-bg: rgba(20, 5, 30, 0.45);
  }

  body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    font-family: 'Courier New', Courier, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background-color: var(--theme-bg);
    overflow: hidden;
    color: white;
    perspective: 1200px;
    cursor: crosshair;
    user-select: none;
    transition: background-color 0.4s ease;
  }

  body:active { cursor: grabbing; }

  #canvas-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }

  .scanlines {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.18) 50%, rgba(0,0,0,0.18));
    background-size: 100% 4px;
    pointer-events: none;
    z-index: 1;
  }

  @keyframes panelGlow {
    0% { box-shadow: 0 30px 60px rgba(0,0,0,0.9), inset 0 0 20px rgba(255,255,255,0.05), 0 0 15px rgba(255,255,255,0.1); }
    100% { box-shadow: 0 30px 60px rgba(0,0,0,0.9), inset 0 0 20px rgba(255,255,255,0.05), 0 0 40px var(--theme-color); }
  }

  .glass-panel {
    position: relative;
    z-index: 2;
    background: var(--panel-bg); 
    backdrop-filter: blur(14px) saturate(180%);
    -webkit-backdrop-filter: blur(14px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 16px;
    padding: 30px 40px;
    width: 780px;
    max-width: 92%;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: transform 0.1s ease-out, box-shadow 0.3s ease, background 0.4s ease;
    transform-style: preserve-3d;
    animation: panelGlow 3s infinite alternate ease-in-out;
  }

  .title-wrapper {
    position: relative;
    margin: 0 0 18px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .top-warning {
    margin-top: 12px;
    font-size: 11.5px;
    color: var(--orange);
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    text-shadow: 0 0 8px rgba(255, 102, 0, 0.6);
  }

  h1 {
    margin: 0;
    font-weight: 900;
    letter-spacing: 12px;
    font-size: 4.2rem; 
    color: #fff;
    text-transform: uppercase;
    text-align: center;
    text-shadow: 
      0 0 5px rgba(255,255,255,0.8),
      0 0 15px var(--theme-color),
      0 0 30px var(--theme-color);
    transition: all 0.3s ease;
    cursor: pointer;
  }

  h1:hover {
    letter-spacing: 15px;
    transform: scale(1.02);
    text-shadow: 
      0 0 10px rgba(255,255,255,1),
      0 0 25px var(--theme-color),
      0 0 50px var(--theme-color);
  }

  .splash-quote {
    position: absolute;
    top: -15px;
    right: -80px; 
    color: #ffea00;
    font-weight: 900;
    font-size: 17px; 
    text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 0 0 10px rgba(255, 234, 0, 0.6);
    transform: rotate(-15deg);
    pointer-events: auto;
    cursor: crosshair;
    animation: splashBounce 0.4s infinite alternate ease-in-out;
    white-space: nowrap;
    transition: transform 0.2s;
  }

  .splash-quote:hover {
    animation: none;
    transform: scale(1.2) rotate(10deg);
    color: var(--theme-color);
    text-shadow: 1px 1px 0 #000, 0 0 15px var(--theme-color);
  }

  @keyframes splashBounce {
    0% { transform: scale(1) rotate(-15deg); }
    100% { transform: scale(1.05) rotate(-15deg); }
  }

  /* 6 Epic Game-Changing Theme Switcher */
  .theme-bar {
    display: flex;
    gap: 7px;
    margin-bottom: 18px;
    flex-wrap: wrap;
    justify-content: center;
    z-index: 5;
  }

  .theme-pill {
    background: rgba(0, 0, 0, 0.6);
    border: 1px solid rgba(255,255,255,0.2);
    color: #bbb;
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 1.2px;
    padding: 6px 11px;
    border-radius: 20px;
    cursor: crosshair;
    transition: all 0.25s ease;
    text-transform: uppercase;
  }

  .theme-pill:hover, .theme-pill.active {
    color: #000;
    background: var(--theme-color);
    border-color: var(--theme-color);
    box-shadow: 0 0 14px var(--theme-color);
    font-weight: bold;
    transform: translateY(-1px);
  }

  .grid-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    width: 100%;
    padding: 5px 0;
    transform: translateZ(25px);
  }

  .place-btn {
    background: rgba(0, 0, 0, 0.65);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #e0e0e0;
    padding: 18px 12px;
    font-size: 15px; 
    font-family: inherit;
    font-weight: bold;
    letter-spacing: 2px; 
    cursor: crosshair;
    border-radius: 8px;
    transition: all 0.3s ease-out;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    overflow: hidden;
    text-align: center;
  }

  .place-btn > * { position: relative; z-index: 1; }

  .place-btn:hover {
    background: rgba(255, 255, 255, 0.1);
    transform: scale(1.03);
    border-color: rgba(255, 255, 255, 0.5);
  }

  .place-btn.is-gold { border-color: var(--gold); }
  .place-btn.is-bright-green { border-color: var(--bright-green); }
  .place-btn.is-cyan { border-color: var(--cyan); }

  .place-btn.is-gold:hover { box-shadow: 0 0 20px 5px rgba(255, 215, 0, 0.7); }
  .place-btn.is-bright-green:hover { box-shadow: 0 0 20px 5px rgba(50, 205, 50, 0.7); }
  .place-btn.is-cyan:hover { box-shadow: 0 0 20px 5px rgba(0, 229, 255, 0.7); }

  .mini-label {
    font-size: 10px;
    margin-bottom: 5px;
    letter-spacing: 1px;
    text-shadow: 0 0 8px currentColor;
    animation: pulseBadge 1.5s infinite alternate ease-in-out;
  }

  @keyframes pulseBadge {
    0% { opacity: 0.7; transform: scale(0.98); }
    100% { opacity: 1; transform: scale(1.02); }
  }

  .status-working {
    font-size: 10.5px;
    color: rgba(255, 255, 255, 0.4);
    margin-top: 5px;
    letter-spacing: 1px;
    font-weight: normal;
  }
  .place-btn:hover .status-working { color: rgba(255, 255, 255, 0.95); }

  /* Bakery Launcher Bar */
  .bakery-toggle-btn {
    margin-top: 18px;
    width: 100%;
    background: rgba(0, 0, 0, 0.75);
    border: 1px dashed var(--theme-color);
    color: #fff;
    padding: 13px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: bold;
    letter-spacing: 2.5px;
    cursor: crosshair;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .bakery-toggle-btn:hover {
    background: var(--theme-color);
    color: #000;
    box-shadow: 0 0 25px var(--theme-color);
    border-style: solid;
  }

  .oven-dot {
    width: 8px;
    height: 8px;
    background: #39ff14;
    border-radius: 50%;
    box-shadow: 0 0 10px #39ff14;
    animation: ovenPulse 1s infinite alternate;
  }

  @keyframes ovenPulse {
    0% { opacity: 0.3; transform: scale(0.8); }
    100% { opacity: 1; transform: scale(1.2); }
  }

  /* THE BAKERY GLOBAL CHAT DRAWER */
  .bakery-chat-panel {
    position: fixed;
    right: -450px;
    top: 0;
    width: 420px;
    max-width: 95vw;
    height: 100vh;
    background: rgba(4, 1, 10, 0.92);
    backdrop-filter: blur(24px) saturate(200%);
    -webkit-backdrop-filter: blur(24px) saturate(200%);
    border-left: 2px solid var(--theme-color);
    box-shadow: -15px 0 45px rgba(0,0,0,0.9), 0 0 25px var(--theme-color);
    z-index: 100;
    transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex;
    flex-direction: column;
  }

  .bakery-chat-panel.open { right: 0; }

  .chat-header {
    padding: 16px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.12);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,0,0,0.5);
  }

  .chat-title {
    font-weight: 900;
    letter-spacing: 2px;
    color: #fff;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 9px;
    text-shadow: 0 0 10px var(--theme-color);
  }

  .chat-status-text {
    font-size: 10px;
    color: var(--lime);
    letter-spacing: 1px;
    font-weight: normal;
  }

  .chat-close-btn {
    background: transparent;
    border: none;
    color: #aaa;
    font-size: 22px;
    cursor: crosshair;
    font-family: inherit;
    transition: color 0.2s;
  }
  .chat-close-btn:hover { color: var(--theme-color); }

  .chat-user-bar {
    padding: 10px 18px;
    background: rgba(0,0,0,0.35);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11.5px;
  }

  .chat-user-input {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    color: var(--theme-color);
    padding: 4px 8px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 12px;
    width: 150px;
    outline: none;
  }

  .chat-user-input:focus { border-color: var(--theme-color); }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 15px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    font-size: 13px;
  }

  .chat-messages::-webkit-scrollbar { width: 4px; }
  .chat-messages::-webkit-scrollbar-thumb { background: var(--theme-color); border-radius: 2px; }

  .chat-bubble {
    background: rgba(255, 255, 255, 0.04);
    border-left: 2px solid var(--theme-color);
    padding: 9px 12px;
    border-radius: 0 8px 8px 0;
    word-break: break-word;
    animation: msgFade 0.2s ease-out;
  }

  @keyframes msgFade {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .chat-msg-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
    font-size: 11px;
  }

  .chat-msg-user { font-weight: bold; color: var(--theme-color); }
  .chat-msg-time { color: rgba(255,255,255,0.4); font-size: 10px; }
  .chat-msg-text { color: #eee; line-height: 1.4; }

  .chat-input-area {
    padding: 14px 18px;
    border-top: 1px solid rgba(255,255,255,0.1);
    display: flex;
    gap: 8px;
    background: rgba(0,0,0,0.6);
  }

  .chat-msg-input {
    flex: 1;
    background: rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    padding: 10px 12px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 13px;
    outline: none;
  }

  .chat-msg-input:focus {
    border-color: var(--theme-color);
    box-shadow: 0 0 8px var(--theme-color);
  }

  .chat-send-btn {
    background: var(--theme-color);
    color: #000;
    border: none;
    padding: 0 16px;
    border-radius: 6px;
    font-weight: bold;
    font-family: inherit;
    cursor: crosshair;
    transition: all 0.2s;
  }

  .chat-send-btn:hover {
    box-shadow: 0 0 12px var(--theme-color);
    transform: scale(1.04);
  }

  /* STARTUP ANIMATION OVERLAY */
  #startup-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background: #010004;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 0.4s ease-out;
    pointer-events: auto;
  }

  .startup-loader {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .startup-logo {
    font-size: 40px;
    font-weight: 900;
    letter-spacing: 16px;
    color: #fff;
    text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
    animation: bootGlitch 0.6s infinite alternate;
  }

  .startup-bar-container {
    width: 280px;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }

  .startup-bar-fill {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    width: 0%;
    background: var(--theme-color);
    box-shadow: 0 0 10px var(--theme-color);
    animation: bootFill 1.1s cubic-bezier(0.1, 0.7, 0.1, 1) forwards;
  }

  .startup-sub {
    font-size: 11px;
    letter-spacing: 3px;
    color: rgba(255,255,255,0.6);
    text-transform: uppercase;
  }

  @keyframes bootFill {
    0% { width: 0%; }
    50% { width: 60%; }
    100% { width: 100%; }
  }

  @keyframes bootGlitch {
    0% { opacity: 0.9; transform: skew(0deg); }
    50% { opacity: 1; transform: skew(-1deg); }
    100% { opacity: 0.8; transform: skew(1deg); }
  }

  .test-tool { position: absolute; bottom: 15px; z-index: 10; opacity: 0.2; transition: opacity 0.3s; display: flex; gap: 10px; }
  .test-tool:hover { opacity: 1; }
  .test-input { background: #111; border: 1px solid #444; color: white; padding: 8px; border-radius: 4px; font-family: inherit; width: 180px; cursor: text;}
  .test-btn { background: #222; border: 1px solid #666; color: #fff; cursor: crosshair; padding: 0 12px; border-radius: 4px; font-family: inherit; transition: all 0.2s;}
  .test-btn:hover { background: var(--theme-color); color: #000; border-color: var(--theme-color); box-shadow: 0 0 15px var(--theme-color); }
</style>
</head>
<body data-theme="dynamic">

  <!-- Startup Animation -->
  <div id="startup-overlay" onclick="dismissStartup()">
    <div class="startup-loader">
      <div class="startup-logo">COMPILATION</div>
      <div class="startup-bar-container">
        <div class="startup-bar-fill"></div>
      </div>
      <div class="startup-sub" id="boot-status">INITIALIZING SYSTEM KERNEL...</div>
    </div>
  </div>

  <canvas id="canvas-bg"></canvas>
  <div class="scanlines"></div>

  <div class="glass-panel" id="tilt-panel">
    <div class="title-wrapper">
      <h1 id="main-title">COMPILATION</h1>
      <div class="splash-quote" id="splash-text"></div>
      <div class="top-warning">if you visit these sites without using compilation they wont work when you try again</div>
    </div>

    <!-- 6 Game-Changing Themes Switcher -->
    <div class="theme-bar">
      <button class="theme-pill active" onclick="setTheme('dynamic', this)">Dynamic RGB</button>
      <button class="theme-pill" onclick="setTheme('matrix', this)">Matrix Rain</button>
      <button class="theme-pill" onclick="setTheme('synthwave', this)">Synthwave '84</button>
      <button class="theme-pill" onclick="setTheme('blackhole', this)">Black Hole</button>
      <button class="theme-pill" onclick="setTheme('cyberpunk', this)">Cyber Storm</button>
      <button class="theme-pill" onclick="setTheme('hyperspace', this)">Hyperspace</button>
      <button class="theme-pill" onclick="setTheme('vapor', this)">Arcade Vapor</button>
    </div>

    <!-- Places: Pie Place 04, Pie Place 05, and Google Doc Place -->
    <div class="grid-container" id="menu"></div>

    <!-- The Bakery Live Global Chat -->
    <button class="bakery-toggle-btn" onclick="toggleBakeryChat()">
      <span class="oven-dot"></span>
      <span>ENTER THE BAKERY [LIVE GLOBAL CHAT]</span>
    </button>
  </div>

  <!-- THE BAKERY DRAWER -->
  <div class="bakery-chat-panel" id="bakery-panel">
    <div class="chat-header">
      <div class="chat-title">
        <span class="oven-dot"></span>
        <span>THE BAKERY</span>
      </div>
      <span class="chat-status-text" id="chat-conn-status">● CONNECTING</span>
      <button class="chat-close-btn" onclick="toggleBakeryChat()">✕</button>
    </div>
    <div class="chat-user-bar">
      <span>HANDLE:</span>
      <input type="text" id="chatHandle" class="chat-user-input" maxlength="15" placeholder="Baker_#">
    </div>
    <div class="chat-messages" id="chatList"></div>
    <div class="chat-input-area">
      <input type="text" id="chatInput" class="chat-msg-input" placeholder="Bake a message..." maxlength="200" onkeydown="handleChatKey(event)">
      <button class="chat-send-btn" onclick="sendBakeryMessage()">SEND</button>
    </div>
  </div>

  <div class="test-tool">
    <input type="text" id="testUrl" class="test-input" placeholder="URL to Hex">
    <button onclick="testLink()" class="test-btn">ENCODE</button>
  </div>

  <script>
    /* STARTUP SEQUENCE */
    function dismissStartup() {
      const overlay = document.getElementById('startup-overlay');
      if (overlay && overlay.style.display !== 'none') {
        overlay.style.opacity = '0';
        setTimeout(() => { overlay.style.display = 'none'; }, 400);
      }
    }
    setTimeout(() => {
      const status = document.getElementById('boot-status');
      if(status) status.innerText = "SYSTEMS READY • ACCESS GRANTED";
    }, 600);
    setTimeout(dismissStartup, 1300);
    window.addEventListener('keydown', (e) => { if(e.key === 'Escape') dismissStartup(); });

    /* PLACES CONFIGURATION */
    const places = [
      { 
        label: "PIE PLACE 04", 
        hex: "68747470733a2f2f666f72742e726569646368616c66696e2e776f726b6572732e646576", 
        colorClass: 'is-gold', 
        isFavorite: true 
      },
      { 
        label: "PIE PLACE 05", 
        hex: "68747470733a2f2f676168323232322e6769746875622e696f2f4e6f6f62732f", 
        colorClass: 'is-bright-green', 
        isClassic: true 
      },
      { 
        label: "PIE ARCHIVE", 
        hex: "68747470733a2f2f646f63732e676f6f676c652e636f6d2f646f63756d656e742f642f3169446568464939546549456c5f2d4964724558595a7237382d7a31504e4f6d6975344947664c73437163342f656469743f7461623d742e396c703866787868337977", 
        colorClass: 'is-cyan', 
        isDoc: true,
        direct: true
      }
    ];

    const menu = document.getElementById('menu');
    const panel = document.getElementById('tilt-panel');

    places.forEach(p => {
      const btn = document.createElement('button');
      btn.className = 'place-btn';
      if (p.colorClass) btn.classList.add(p.colorClass);

      let topLabel = '';
      if (p.isDoc) {
        topLabel = `<span class="mini-label" style="color: var(--cyan);">📄 GOOGLE DOC 📄</span>`;
      } else if (p.isFavorite) {
        topLabel = `<span class="mini-label" style="color: var(--gold);">★ FAVORITE ★</span>`;
      } else if (p.isClassic) {
        topLabel = `<span class="mini-label" style="color: var(--lime);">⚙️ CLASSIC ⚙️</span>`;
      }

      let statusHtml = `<span class="status-working">working</span>`;
      btn.innerHTML = `${topLabel}<span>${p.label}</span>${statusHtml}`;
      btn.onclick = () => initSession(p.hex, p.direct);
      menu.appendChild(btn);
    });

    document.addEventListener('mousemove', (e) => {
      let xAxis = (window.innerWidth / 2 - e.pageX) / 150; 
      let yAxis = (window.innerHeight / 2 - e.pageY) / -150;
      panel.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
    });
    
    document.addEventListener('mouseleave', () => {
      panel.style.transform = `rotateY(0deg) rotateX(0deg)`;
    });

    function initSession(h, isDirect = false) {
      let u = '';
      for (let i = 0; i < h.length; i += 2) u += String.fromCharCode(parseInt(h.substr(i, 2), 16));
      if (isDirect) {
        window.open(u, '_blank');
      } else {
        launch(u);
      }
    }

    function testLink() {
      const url = document.getElementById('testUrl').value;
      if(!url) return;
      let hex = '';
      for(let i=0;i<url.length;i++) hex += url.charCodeAt(i).toString(16);
      launch(url);
    }

    function launch(url) {
      const id = Math.floor(Math.random() * 100000);
      const sep = url.includes('?') ? '&' : '?';
      const target = `${url}${sep}session=${id}`;

      const currentColor = getComputedStyle(document.documentElement).getPropertyValue('--theme-color').trim();
      const greetings = ["good luck", "have fun", "Goodbye", "See ya"];
      const randomGreeting = greetings[Math.floor(Math.random() * greetings.length)];

      const w = window.open('about:blank', '_blank');
      if (w) {
        w.document.write(`
          <style>
            html, body { margin: 0; padding: 0; background: #000; overflow: hidden; width: 100vw; height: 100vh; color: #fff; font-family: 'Courier New', monospace; display: flex; flex-direction: column; justify-content: center; align-items: center; }
            .msg { font-size: 36px; font-weight: bold; z-index: 10; animation: float 2s infinite alternate ease-in-out; text-align: center; transition: opacity 0.5s ease; text-shadow: 0 0 15px ${currentColor}, 0 0 30px ${currentColor}; pointer-events: none; }
            .sub { font-size: 18px; color: rgba(255,255,255,0.8); margin-top: 15px; text-shadow: none; pointer-events: none; }
            @keyframes float { 0% { transform: translateY(-5px); } 100% { transform: translateY(5px); } }
            iframe { 
              display: block; width: 100vw; height: 100vh; border: none; margin: 0; padding: 0; position: absolute; top: 0; left: 0; 
              z-index: 3; background: #000; opacity: 0; transform: scale(0.01); 
              transition: transform 0.65s cubic-bezier(0.1, 1, 0.2, 1), opacity 0.3s ease-out; 
            }
            canvas { position: absolute; top: 0; left: 0; z-index: 1; pointer-events: none; transition: opacity 1.5s ease-in-out; }
          </style>
          <canvas id="warpCanvas"></canvas>
          <iframe id="frm" src="${target}" allowfullscreen sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-forms"></iframe>
          <div class="msg" id="ldr">${randomGreeting}<div class="sub">-Meowmaster</div></div>
          
          <script>
            const wc = document.getElementById('warpCanvas');
            const wctx = wc.getContext('2d');
            let stars = [];
            wc.width = window.innerWidth; wc.height = window.innerHeight;
            for(let i=0; i<600; i++) {
              stars.push({
                x: Math.random()*wc.width-wc.width/2, 
                y: Math.random()*wc.height-wc.height/2, 
                z: Math.random()*wc.width,
                pz: Math.random()*wc.width 
              });
            }
            let speed = 0.5;
            let animationFrameId;
            let isTransitioning = false;

            function animateWarp() {
              speed += 0.2 + (speed * 0.025); 
              if (speed > 130 && !isTransitioning) {
                isTransitioning = true;
                document.getElementById('ldr').style.opacity = '0';
                const frame = document.getElementById('frm');
                frame.style.opacity = '1';
                frame.style.transform = 'scale(1)';
                setTimeout(() => { wc.style.opacity = '0'; }, 800);
                setTimeout(() => { cancelAnimationFrame(animationFrameId); }, 2500);
              }

              wctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
              wctx.fillRect(0,0,wc.width,wc.height);
              let cx = wc.width/2; let cy = wc.height/2;
              
              for(let i=0; i<stars.length; i++) {
                stars[i].pz = stars[i].z; 
                stars[i].z -= speed;
                if(stars[i].z <= 1) { 
                  stars[i].z = wc.width; 
                  stars[i].pz = wc.width;
                  stars[i].x = Math.random()*wc.width-wc.width/2;
                  stars[i].y = Math.random()*wc.height-wc.height/2;
                }
                let sx = (stars[i].x / stars[i].z) * wc.width + cx;
                let sy = (stars[i].y / stars[i].z) * wc.width + cy;
                let px = (stars[i].x / stars[i].pz) * wc.width + cx;
                let py = (stars[i].y / stars[i].pz) * wc.width + cy;
                
                wctx.beginPath();
                wctx.moveTo(px, py);
                wctx.lineTo(sx, sy);
                wctx.lineWidth = Math.max(0.5, (1 - stars[i].z/wc.width) * 4);
                wctx.strokeStyle = (i % 4 === 0) ? '${currentColor}' : '#ffffff'; 
                wctx.stroke();
              }

              if (!isTransitioning || wc.style.opacity !== '0') {
                animationFrameId = requestAnimationFrame(animateWarp);
              }
            }
            animateWarp();
          <\/script>
        `);
        w.document.close();
      }
    }

    const quotes = [
      "100% legal",
      "Also try Opera GX",
      "Never leave your pie in for too long",
      "Remember the good old days",
      "RIP Sweet Tea",
      "JC>CC",
      "T-cubed",
      "Takis! Takis! Takis!",
      "does anyone even read these?",
      "Lafayette B.",
      "No Oil rigs here",
      "say grenade 10 times fast",
      "2-Crack, Plumbous, Rodrick, Slopadopalis",
      "BLEHELEHEHHEEHH",
      "Stay Strong Showtime Abdul Al Baker",
      "Apple pie is good",
      "time to get some stuff done",
      "Travis or Youngboy?",
      "This site has 1.3K views as of Feb 26",
      "are you rushing or are you dragging?",
      "Not quite my tempo...",
      "That's my tempo..."
    ];
    document.getElementById('splash-text').innerText = quotes[Math.floor(Math.random() * quotes.length)];

    /* =========================================================================
       THE BAKERY REALTIME CROSS-DEVICE CHAT (MQTT WebSockets)
       Works seamlessly across any browser, phone, PC, and network!
       ========================================================================= */
    const defaultHandle = 'Baker_' + Math.floor(1000 + Math.random() * 9000);
    const handleInput = document.getElementById('chatHandle');
    handleInput.value = localStorage.getItem('bakery_handle') || defaultHandle;
    handleInput.addEventListener('change', () => {
      localStorage.setItem('bakery_handle', handleInput.value.trim() || defaultHandle);
    });

    const chatList = document.getElementById('chatList');
    const statusText = document.getElementById('chat-conn-status');
    const BAKERY_TOPIC = 'compilation/the_bakery/chat/global_v4';

    // Connect to EMQX Public WebSocket MQTT Broker
    const mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
      clientId: 'baker_' + Math.random().toString(16).substring(2, 10),
      clean: true,
      connectTimeout: 4000,
      reconnectPeriod: 2500
    });

    mqttClient.on('connect', () => {
      statusText.innerText = '● LIVE (BAKERY OVEN HOT)';
      statusText.style.color = '#39ff14';
      mqttClient.subscribe(BAKERY_TOPIC);
    });

    mqttClient.on('reconnect', () => {
      statusText.innerText = '● RECONNECTING...';
      statusText.style.color = '#ff6600';
    });

    mqttClient.on('offline', () => {
      statusText.innerText = '● OFFLINE';
      statusText.style.color = '#ff073a';
    });

    // Message History Storage
    let savedHistory = JSON.parse(localStorage.getItem('bakery_history_v2') || '[]');
    savedHistory.forEach(renderChatMessage);

    mqttClient.on('message', (topic, payload) => {
      try {
        const msg = JSON.parse(payload.toString());
        renderChatMessage(msg);
        savedHistory.push(msg);
        if (savedHistory.length > 50) savedHistory.shift();
        localStorage.setItem('bakery_history_v2', JSON.stringify(savedHistory));
      } catch (err) {
        console.error(err);
      }
    });

    function renderChatMessage(msg) {
      const bubble = document.createElement('div');
      bubble.className = 'chat-bubble';
      const timeStr = msg.time ? new Date(msg.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
      
      const safeUser = document.createElement('div'); safeUser.innerText = msg.user || 'Baker';
      const safeText = document.createElement('div'); safeText.innerText = msg.text || '';

      bubble.innerHTML = `
        <div class="chat-msg-header">
          <span class="chat-msg-user">${safeUser.innerHTML}</span>
          <span class="chat-msg-time">${timeStr}</span>
        </div>
        <div class="chat-msg-text">${safeText.innerHTML}</div>
      `;
      chatList.appendChild(bubble);
      chatList.scrollTop = chatList.scrollHeight;
    }

    function toggleBakeryChat() {
      const p = document.getElementById('bakery-panel');
      p.classList.toggle('open');
      if (p.classList.contains('open')) {
        document.getElementById('chatInput').focus();
      }
    }

    function handleChatKey(e) {
      if (e.key === 'Enter') sendBakeryMessage();
    }

    function sendBakeryMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      const user = handleInput.value.trim() || defaultHandle;
      const msgObj = {
        user: user,
        text: text,
        time: Date.now()
      };

      mqttClient.publish(BAKERY_TOPIC, JSON.stringify(msgObj));
      input.value = '';
    }

    /* =========================================================================
       6 GAME-CHANGING CANVAS THEME ENGINES
       ========================================================================= */
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let activeTheme = 'dynamic';
    let globalHue = 180;
    let mouse = { x: null, y: null };
    let isLeftMouseDown = false;
    let isRightMouseDown = false;
    let isTimeFrozen = false; 
    let isOvercharged = false; 

    window.addEventListener('mousemove', e => { mouse.x = e.x; mouse.y = e.y; });
    window.addEventListener('mouseout', () => { mouse.x = undefined; mouse.y = undefined; isLeftMouseDown = false; isRightMouseDown = false; });
    window.addEventListener('mousedown', e => { if (e.button === 0) isLeftMouseDown = true; if (e.button === 2) isRightMouseDown = true; });
    window.addEventListener('contextmenu', e => e.preventDefault());
    window.addEventListener('keydown', e => { 
      if (e.code === 'Space' && e.target.tagName !== 'INPUT') isTimeFrozen = true; 
      if (e.key === 'Shift') isOvercharged = true; 
    });
    window.addEventListener('keyup', e => { 
      if (e.code === 'Space') isTimeFrozen = false; 
      if (e.key === 'Shift') isOvercharged = false; 
    });

    function setTheme(name, btn) {
      activeTheme = name;
      document.body.setAttribute('data-theme', name);
      document.querySelectorAll('.theme-pill').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');

      const colorMap = {
        dynamic: `hsl(${globalHue}, 100%, 50%)`,
        matrix: '#39ff14',
        synthwave: '#ff00aa',
        blackhole: '#ff7700',
        cyberpunk: '#00e5ff',
        hyperspace: '#9d00ff',
        vapor: '#ff71ce'
      };
      document.documentElement.style.setProperty('--theme-color', colorMap[name]);

      // Re-init engines for the selected theme
      if (name === 'matrix') initMatrix();
      if (name === 'synthwave') initSynthwave();
      if (name === 'blackhole') initBlackhole();
      if (name === 'cyberpunk') initCyberpunk();
      if (name === 'hyperspace') initHyperspace();
      if (name === 'vapor') initVapor();
    }

    /* THEME 0: DYNAMIC RGB PARTICLES */
    let particlesArray = [];
    let ripplesArray = [];

    class Ripple {
      constructor(x, y, isMega = false, colorStr) {
        this.x = x; this.y = y; this.radius = 10; this.alpha = 1; this.colorStr = colorStr;
        this.lineWidth = isMega ? 20 : 8; this.expansionRate = isMega ? 30 : 15;
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.strokeStyle = this.colorStr;
        ctx.lineWidth = this.lineWidth;
        ctx.stroke();
      }
      update() {
        this.radius += this.expansionRate;
        this.alpha -= 0.08;
      }
    }

    class Particle {
      constructor(x, y, vx, vy, size) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy;
        this.baseVx = vx; this.baseVy = vy; this.size = size;
        this.hueOffset = (Math.random() * 40) - 20;
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        let myHue = globalHue + this.hueOffset;
        ctx.fillStyle = isOvercharged ? '#ff00aa' : `hsl(${myHue}, 100%, 50%)`;
        ctx.fill();
      }
      update() {
        if (this.x > canvas.width || this.x < 0) this.vx = -this.vx;
        if (this.y > canvas.height || this.y < 0) this.vy = -this.vy;

        if (mouse.x && mouse.y) {
          let dx = mouse.x - this.x; let dy = mouse.y - this.y;
          let dist = Math.sqrt(dx*dx + dy*dy);
          if (dist < 400) {
            let force = (400 - dist) / 400;
            if (isLeftMouseDown) {
              this.vx += (dx / dist) * force * 5;
              this.vy += (dy / dist) * force * 5;
            } else if (isRightMouseDown) {
              this.vx -= (dx / dist) * force * 5;
              this.vy -= (dy / dist) * force * 5;
            }
          }
        }
        this.x += this.vx; this.y += this.vy;
        this.draw();
      }
    }

    function initParticles() {
      particlesArray = [];
      let count = (canvas.height * canvas.width) / 9000;
      for (let i = 0; i < count; i++) {
        particlesArray.push(new Particle(
          Math.random() * innerWidth, Math.random() * innerHeight,
          (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2,
          Math.random() * 3 + 1.5
        ));
      }
    }

    function renderDynamicParticles() {
      globalHue += 0.2;
      document.documentElement.style.setProperty('--theme-color', `hsl(${globalHue}, 100%, 50%)`);
      ctx.fillStyle = 'rgba(5, 1, 10, 0.2)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < particlesArray.length; i++) {
        particlesArray[i].update();
      }
      for (let a = 0; a < particlesArray.length; a++) {
        for (let b = a; b < particlesArray.length; b++) {
          let dx = particlesArray[a].x - particlesArray[b].x;
          let dy = particlesArray[a].y - particlesArray[b].y;
          let dist = dx*dx + dy*dy;
          if (dist < 14000) {
            ctx.strokeStyle = `hsla(${globalHue}, 100%, 60%, ${1 - dist/14000})`;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
            ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
            ctx.stroke();
          }
        }
      }
    }

    /* THEME 1: MATRIX DIGITAL RAIN */
    let matrixDrops = [];
    const matrixChars = "日ﾊﾐﾋｰｳｼﾅﾓﾆｻﾜﾂｵﾘｱﾎﾃﾏｹﾒｴｶｷﾑﾕﾗｾﾈｽﾀﾇﾍ0123456789COMPILATIONBAKERY";
    function initMatrix() {
      let columns = Math.floor(canvas.width / 16);
      matrixDrops = [];
      for (let i = 0; i < columns; i++) matrixDrops[i] = Math.random() * -100;
    }
    function renderMatrix() {
      ctx.fillStyle = "rgba(0, 8, 2, 0.12)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.font = "14px monospace";

      for (let i = 0; i < matrixDrops.length; i++) {
        const text = matrixChars.charAt(Math.floor(Math.random() * matrixChars.length));
        const x = i * 16;
        const y = matrixDrops[i] * 16;
        ctx.fillStyle = "#ffffff";
        ctx.fillText(text, x, y);
        ctx.fillStyle = "#39ff14";
        ctx.fillText(text, x, y - 16);
        if (y > canvas.height && Math.random() > 0.975) matrixDrops[i] = 0;
        matrixDrops[i]++;
      }
    }

    /* THEME 2: SYNTHWAVE 1984 3D GRID & SUN */
    let synthOffset = 0;
    function initSynthwave() {}
    function renderSynthwave() {
      ctx.fillStyle = "#0a0016";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      let horizon = canvas.height * 0.65;
      let cx = canvas.width / 2;

      // Glowing Sunset
      let sunGrad = ctx.createLinearGradient(cx, horizon - 160, cx, horizon);
      sunGrad.addColorStop(0, "#ffee00");
      sunGrad.addColorStop(0.5, "#ff007f");
      sunGrad.addColorStop(1, "#7f00ff");
      ctx.fillStyle = sunGrad;
      ctx.beginPath();
      ctx.arc(cx, horizon - 20, 140, Math.PI, 0, false);
      ctx.fill();

      // Sun horizontal stripes
      ctx.fillStyle = "#0a0016";
      for (let i = 0; i < 7; i++) {
        let barY = horizon - 20 - (i * 18);
        ctx.fillRect(cx - 140, barY, 280, 4 + i * 1.5);
      }

      // 3D Perspective Grid
      synthOffset = (synthOffset + 2) % 40;
      ctx.strokeStyle = "rgba(255, 0, 170, 0.7)";
      ctx.lineWidth = 2;
      for (let x = -canvas.width; x < canvas.width * 2; x += 60) {
        ctx.beginPath();
        ctx.moveTo(cx, horizon);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = horizon; y < canvas.height; y += 12) {
        let py = y + (synthOffset * ((y - horizon) / (canvas.height - horizon)));
        if (py > canvas.height) continue;
        ctx.beginPath();
        ctx.moveTo(0, py);
        ctx.lineTo(canvas.width, py);
        ctx.stroke();
      }
    }

    /* THEME 3: BLACK HOLE SINGULARITY */
    let cosmicParticles = [];
    function initBlackhole() {
      cosmicParticles = [];
      for (let i = 0; i < 350; i++) {
        cosmicParticles.push({
          angle: Math.random() * Math.PI * 2,
          radius: Math.random() * 380 + 90,
          speed: Math.random() * 0.03 + 0.01,
          size: Math.random() * 2.5 + 1,
          color: Math.random() > 0.5 ? '#ff7700' : '#ffea00'
        });
      }
    }
    function renderBlackhole() {
      ctx.fillStyle = 'rgba(2, 2, 6, 0.25)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      let cx = canvas.width / 2; let cy = canvas.height / 2;

      // Event Horizon Accretion Disk
      cosmicParticles.forEach(p => {
        p.angle += p.speed * (250 / p.radius);
        p.radius -= 0.3;
        if (p.radius < 85) p.radius = 420;

        let x = cx + Math.cos(p.angle) * p.radius * 1.6;
        let y = cy + Math.sin(p.angle) * p.radius * 0.7;

        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(x, y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });

      // Central Shadow Singularity
      ctx.beginPath();
      ctx.arc(cx, cy, 80, 0, Math.PI * 2);
      ctx.fillStyle = '#000000';
      ctx.shadowBlur = 40;
      ctx.shadowColor = '#ff5500';
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    /* THEME 4: CYBERPUNK RAINSTORM */
    let rainDrops = [];
    function initCyberpunk() {
      rainDrops = [];
      for (let i = 0; i < 200; i++) {
        rainDrops.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          l: Math.random() * 25 + 15,
          speed: Math.random() * 12 + 15
        });
      }
    }
    function renderCyberpunk() {
      ctx.fillStyle = 'rgba(3, 8, 20, 0.3)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Rain streaking down
      ctx.strokeStyle = '#00e5ff';
      ctx.lineWidth = 1.5;
      rainDrops.forEach(r => {
        ctx.beginPath();
        ctx.moveTo(r.x, r.y);
        ctx.lineTo(r.x - 2, r.y + r.l);
        ctx.stroke();
        r.y += r.speed;
        r.x -= 1.5;
        if (r.y > canvas.height) { r.y = -20; r.x = Math.random() * canvas.width; }
      });
    }

    /* THEME 5: HYPERSPACE SPEED TUNNEL */
    let warpStars = [];
    function initHyperspace() {
      warpStars = [];
      for (let i = 0; i < 400; i++) {
        warpStars.push({
          x: (Math.random() - 0.5) * canvas.width * 2,
          y: (Math.random() - 0.5) * canvas.height * 2,
          z: Math.random() * canvas.width
        });
      }
    }
    function renderHyperspace() {
      ctx.fillStyle = 'rgba(2, 0, 8, 0.35)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      let cx = canvas.width / 2; let cy = canvas.height / 2;

      warpStars.forEach(s => {
        s.z -= 25;
        if (s.z <= 0) { s.z = canvas.width; s.x = (Math.random() - 0.5) * canvas.width * 2; s.y = (Math.random() - 0.5) * canvas.height * 2; }
        let k = 250 / s.z;
        let px = s.x * k + cx; let py = s.y * k + cy;
        ctx.strokeStyle = '#9d00ff';
        ctx.lineWidth = Math.min(4, (1 - s.z / canvas.width) * 5);
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(px + (px - cx) * 0.15, py + (py - cy) * 0.15);
        ctx.stroke();
      });
    }

    /* THEME 6: ARCADE VAPORWAVE */
    let polyhedra = [];
    function initVapor() {
      polyhedra = [];
      for (let i = 0; i < 20; i++) {
        polyhedra.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          rot: Math.random() * Math.PI,
          speed: (Math.random() - 0.5) * 0.02,
          size: Math.random() * 30 + 20
        });
      }
    }
    function renderVapor() {
      ctx.fillStyle = 'rgba(12, 0, 25, 0.25)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      polyhedra.forEach(p => {
        p.rot += p.speed;
        p.y += 0.5;
        if (p.y > canvas.height + 50) p.y = -50;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.strokeStyle = '#ff71ce';
        ctx.lineWidth = 2;
        ctx.strokeRect(-p.size/2, -p.size/2, p.size, p.size);
        ctx.strokeStyle = '#01cdfe';
        ctx.strokeRect(-p.size/3, -p.size/3, p.size/1.5, p.size/1.5);
        ctx.restore();
      });
    }

    /* MASTER ANIMATION LOOP */
    function masterRenderLoop() {
      requestAnimationFrame(masterRenderLoop);
      if (activeTheme === 'dynamic') renderDynamicParticles();
      else if (activeTheme === 'matrix') renderMatrix();
      else if (activeTheme === 'synthwave') renderSynthwave();
      else if (activeTheme === 'blackhole') renderBlackhole();
      else if (activeTheme === 'cyberpunk') renderCyberpunk();
      else if (activeTheme === 'hyperspace') renderHyperspace();
      else if (activeTheme === 'vapor') renderVapor();
    }

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initParticles();
      if (activeTheme === 'matrix') initMatrix();
      if (activeTheme === 'synthwave') initSynthwave();
      if (activeTheme === 'blackhole') initBlackhole();
      if (activeTheme === 'cyberpunk') initCyberpunk();
      if (activeTheme === 'hyperspace') initHyperspace();
      if (activeTheme === 'vapor') initVapor();
    });

    initParticles();
    masterRenderLoop();
  </script>
</body>
