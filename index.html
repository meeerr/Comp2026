<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COMPILATION</title>
<style>
  /* --- GLOBAL CSS VARIABLES (DEFAULT NEON THEME) --- */
  :root {
    --theme-color: #00ffff; 
    --bg-color: #05010a;
    --font-main: 'Courier New', Courier, monospace;
    --panel-bg: rgba(5, 2, 10, 0.25);
    --panel-border: 1px solid rgba(255, 255, 255, 0.1);
    --panel-radius: 16px;
    --panel-shadow: 0 30px 60px rgba(0,0,0,0.9), inset 0 0 20px rgba(255,255,255,0.05);
    --text-color: #fff;
    --title-shadow: 0 0 5px rgba(255,255,255,0.8), 0 0 15px var(--theme-color);
    --btn-bg: rgba(0, 0, 0, 0.6);
    --btn-border: 1px solid rgba(255, 255, 255, 0.15);
    --btn-radius: 8px;
    --btn-hover-scale: scale(1.01);
    --canvas-display: block;
    --scanline-display: block;
    --css-bg-display: none;
    --splash-color: #ffea00;
  }

  body {
    margin: 0; padding: 0; width: 100vw; height: 100vh;
    font-family: var(--font-main);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background-color: var(--bg-color);
    overflow: hidden; color: var(--text-color);
    perspective: 1200px; cursor: crosshair; user-select: none;
    transition: all 0.5s ease;
  }
  body:active { cursor: grabbing; }

  /* --- CANVAS & BACKGROUNDS --- */
  #canvas-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; display: var(--canvas-display); }
  
  .scanlines {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.15) 50%, rgba(0,0,0,0.15));
    background-size: 100% 4px; pointer-events: none; z-index: 1;
    display: var(--scanline-display);
  }

  /* CSS Backgrounds for non-particle themes */
  .css-background {
    position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
    z-index: 0; display: var(--css-bg-display); pointer-events: none;
  }

  /* --- THEME OVERRIDES --- */
  
  /* 1. BRUTALISM (Loud, Sharp, Edgy) */
  body.theme-brutalism {
    --bg-color: #f0f0f0; --text-color: #000;
    --font-main: 'Impact', 'Arial Black', sans-serif;
    --panel-bg: #fff; --panel-border: 4px solid #000; --panel-radius: 0px;
    --panel-shadow: 12px 12px 0px #000;
    --title-shadow: 4px 4px 0px #ff003c;
    --btn-bg: #fff; --btn-border: 3px solid #000; --btn-radius: 0px;
    --btn-hover-scale: translate(-4px, -4px);
    --canvas-display: none; --scanline-display: none; --css-bg-display: block;
    --theme-color: #ff003c; --splash-color: #000;
  }
  body.theme-brutalism .css-background {
    background-image: radial-gradient(#000 2px, transparent 2px);
    background-size: 30px 30px; opacity: 0.1;
    animation: brutalizerShake 0.1s infinite;
  }
  @keyframes brutalizerShake { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(1px, 1px); } }
  body.theme-brutalism .place-btn { color: #000; box-shadow: 4px 4px 0px #000; }
  body.theme-brutalism .place-btn:hover { box-shadow: 8px 8px 0px var(--theme-color); border-color: var(--theme-color); }
  body.theme-brutalism .glass-panel { backdrop-filter: none; }

  /* 2. MATCHA (Soft, Cozy, Clean) */
  body.theme-matcha {
    --bg-color: #f4efe6; --text-color: #4a5d23;
    --font-main: 'Trebuchet MS', 'Lucida Sans Unicode', sans-serif;
    --panel-bg: rgba(255, 255, 255, 0.7); --panel-border: 1px solid rgba(255,255,255,0.8);
    --panel-radius: 40px; --panel-shadow: 0 20px 40px rgba(74, 93, 35, 0.1);
    --title-shadow: none;
    --btn-bg: #e8ecd7; --btn-border: 1px solid transparent; --btn-radius: 30px;
    --btn-hover-scale: scale(1.03);
    --canvas-display: none; --scanline-display: none; --css-bg-display: block;
    --theme-color: #8da35c; --splash-color: #d4a373;
  }
  body.theme-matcha .css-background {
    background: radial-gradient(circle at 15% 50%, rgba(141,163,92,0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(212,163,115,0.15), transparent 25%);
    animation: floatBg 6s ease-in-out infinite;
  }
  @keyframes floatBg { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(20px); } }
  body.theme-matcha .place-btn { color: #4a5d23; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
  body.theme-matcha .place-btn:hover { background: #fff; box-shadow: 0 10px 20px rgba(141,163,92,0.2); }
  body.theme-matcha h1 { letter-spacing: 4px; font-weight: 700; color: #4a5d23; }
  body.theme-matcha h1:hover { letter-spacing: 6px; }

  /* 3. AERO (Y2K, Glossy, Frutiger Aero) */
  body.theme-aero {
    --bg-color: #0078d7; --text-color: #fff;
    --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    --panel-bg: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.1) 100%);
    --panel-border: 1px solid rgba(255,255,255,0.6); --panel-radius: 12px;
    --panel-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 2px 2px rgba(255,255,255,0.8);
    --title-shadow: 0 2px 4px rgba(0,0,0,0.5);
    --btn-bg: linear-gradient(to bottom, rgba(255,255,255,0.3), rgba(255,255,255,0.1));
    --btn-border: 1px solid rgba(255,255,255,0.5); --btn-radius: 8px;
    --btn-hover-scale: scale(1.02);
    --canvas-display: none; --scanline-display: none; --css-bg-display: block;
    --theme-color: #00ffcc; --splash-color: #a4ff00;
  }
  body.theme-aero .css-background {
    background: linear-gradient(to bottom, #56ccf2, #2f80ed);
    opacity: 0.8;
    animation: aeroGradient 4s ease-in-out infinite;
  }
  @keyframes aeroGradient { 0%, 100% { background: linear-gradient(to bottom, #56ccf2, #2f80ed); } 50% { background: linear-gradient(to bottom, #2f80ed, #56ccf2); } }
  body.theme-aero .place-btn { color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.4); box-shadow: inset 0 1px 0 rgba(255,255,255,0.6); }
  body.theme-aero .place-btn:hover { background: linear-gradient(to bottom, rgba(255,255,255,0.5), rgba(255,255,255,0.2)); border-color: #fff; box-shadow: 0 0 15px rgba(255,255,255,0.4), inset 0 1px 0 rgba(255,255,255,0.6); }

  /* --- UI ELEMENTS --- */
  .glass-panel {
    position: relative; z-index: 2;
    background: var(--panel-bg);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: var(--panel-border); border-radius: var(--panel-radius);
    padding: 40px; width: 750px; max-width: 90%;
    display: flex; flex-direction: column; align-items: center;
    box-shadow: var(--panel-shadow);
    transition: transform 0.1s ease-out, all 0.4s ease; transform-style: preserve-3d;
  }

  .title-wrapper { position: relative; margin: 0 0 40px 0; display: flex; flex-direction: column; align-items: center; }

  .top-warning {
    margin-top: 15px; font-size: 13px; color: var(--theme-color);
    text-align: center; text-transform: uppercase; letter-spacing: 1.5px; font-weight: bold;
  }

  h1 {
    margin: 0; font-weight: 900; letter-spacing: 12px; font-size: 4.5rem; 
    color: var(--text-color); text-transform: uppercase; text-align: center;
    text-shadow: var(--title-shadow); transition: all 0.3s ease; cursor: pointer;
  }
  h1:hover { transform: scale(1.02); }

  .splash-quote {
    position: absolute; top: -15px; right: -80px; 
    color: var(--splash-color); font-weight: 900; font-size: 18px; 
    transform: rotate(-15deg); pointer-events: auto; cursor: crosshair;
    animation: splashBounce 0.4s infinite alternate ease-in-out; white-space: nowrap; transition: transform 0.2s;
  }
  @keyframes splashBounce { 0% { transform: scale(1) rotate(-15deg); } 100% { transform: scale(1.05) rotate(-15deg); } }

  .grid-container {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px;
    width: 100%; max-height: 55vh; overflow-y: auto; padding: 10px; transform: translateZ(25px);
  }
  .grid-container::-webkit-scrollbar { width: 0; }

  .place-btn {
    background: var(--btn-bg); border: var(--btn-border); color: var(--text-color);
    padding: 18px; font-size: 18px; font-family: inherit; font-weight: bold;
    letter-spacing: 2px; cursor: crosshair; border-radius: var(--btn-radius);
    transition: all 0.2s ease-out; position: relative; display: flex;
    align-items: center; justify-content: center; flex-direction: column; overflow: hidden;
  }
  .place-btn > * { position: relative; z-index: 1; }
  .place-btn:hover { transform: var(--btn-hover-scale); }

  .mini-label { font-size: 11px; margin-bottom: 5px; letter-spacing: 1px; animation: pulseBadge 1.5s infinite alternate ease-in-out; }
  @keyframes pulseBadge { 0% { opacity: 0.7; } 100% { opacity: 1; } }

  .status-working, .status-warning { font-size: 11px; margin-top: 6px; letter-spacing: 1px; font-weight: normal; opacity: 0.6; }
  .place-btn:hover .status-working, .place-btn:hover .status-warning { opacity: 1; }

  /* --- SLEEK THEME SELECTOR --- */
  .theme-selector {
    position: fixed; top: 25px; right: 25px; z-index: 20; display: flex; gap: 6px;
    background: rgba(0, 0, 0, 0.3); padding: 10px 12px; border-radius: 20px;
    backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1);
  }
  
  .theme-btn-sel {
    background: transparent; border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.5);
    padding: 6px 10px; font-family: inherit; font-size: 11px; font-weight: bold; cursor: pointer;
    border-radius: 12px; transition: all 0.2s ease; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .theme-btn-sel:hover { color: rgba(255,255,255,0.8); background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.4); }
  .theme-btn-sel.active { background: var(--theme-color); color: #000; box-shadow: 0 0 12px rgba(0, 255, 255, 0.5); border-color: var(--theme-color); }

  /* --- BAKERY CHAT FEATURE --- */
  .bakery-fab {
    position: fixed; bottom: 25px; right: 25px; z-index: 20;
    width: 50px; height: 50px; border-radius: 50%; background: var(--theme-color); color: #000;
    border: none; cursor: pointer; font-weight: bold; font-size: 22px; display: flex;
    align-items: center; justify-content: center; transition: all 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }
  .bakery-fab:hover { transform: scale(1.1); box-shadow: 0 6px 20px var(--theme-color); }

  .bakery-panel {
    position: fixed; bottom: 25px; right: 25px; z-index: 19;
    width: 350px; height: 500px; background: var(--panel-bg);
    backdrop-filter: blur(12px); border: var(--panel-border); border-radius: var(--panel-radius);
    box-shadow: var(--panel-shadow); display: flex; flex-direction: column;
    transform: scale(0.95) translateY(20px); opacity: 0; pointer-events: none; transition: all 0.3s ease;
  }

  .bakery-panel.open {
    transform: scale(1) translateY(0); opacity: 1; pointer-events: auto;
  }

  .bakery-header {
    padding: 15px; border-bottom: var(--panel-border);
    display: flex; justify-content: space-between; align-items: center;
  }

  .bakery-title { font-size: 15px; font-weight: bold; letter-spacing: 1.5px; text-transform: uppercase; }
  .bakery-online { font-size: 10px; color: var(--theme-color); letter-spacing: 0.5px; }

  .bakery-close { background: none; border: none; color: var(--text-color); cursor: pointer; font-size: 20px; opacity: 0.6; transition: opacity 0.2s; }
  .bakery-close:hover { opacity: 1; }

  .bakery-chat {
    flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px;
  }
  .bakery-chat::-webkit-scrollbar { width: 4px; }
  .bakery-chat::-webkit-scrollbar-track { background: transparent; }
  .bakery-chat::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

  .chat-msg {
    padding: 8px 12px; border-radius: 8px; font-size: 12px; line-height: 1.4;
    word-wrap: break-word; animation: msgSlideIn 0.3s ease;
  }
  @keyframes msgSlideIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

  .chat-msg.other { background: rgba(255,255,255,0.08); color: var(--text-color); }
  .chat-msg.self { background: var(--theme-color); color: #000; margin-left: auto; max-width: 85%; text-align: right; }
  .chat-msg.system { background: rgba(0,255,255,0.1); color: var(--theme-color); text-align: center; font-size: 10px; margin: 5px 0; }

  .chat-name { font-size: 10px; opacity: 0.7; margin-bottom: 2px; text-transform: uppercase; letter-spacing: 0.5px; }

  .bakery-input-area {
    padding: 12px; border-top: var(--panel-border); display: flex; gap: 8px;
  }

  .bakery-name-input, .bakery-msg-input {
    background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: var(--text-color);
    padding: 8px 10px; border-radius: 6px; font-family: inherit; font-size: 11px;
    transition: all 0.2s; flex: 1;
  }

  .bakery-name-input::placeholder, .bakery-msg-input::placeholder { color: rgba(255,255,255,0.3); }
  .bakery-name-input:focus, .bakery-msg-input:focus { outline: none; border-color: var(--theme-color); background: rgba(0,0,0,0.5); }

  .bakery-send {
    background: var(--theme-color); border: none; color: #000; cursor: pointer;
    padding: 8px 12px; border-radius: 6px; font-weight: bold; font-family: inherit; font-size: 11px;
    transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .bakery-send:hover { transform: scale(1.05); box-shadow: 0 0 15px var(--theme-color); }
  .bakery-send:active { transform: scale(0.95); }

</style>
</head>
<body class="theme-default">

  <canvas id="canvas-bg"></canvas>
  <div class="scanlines"></div>
  <div class="css-background"></div>

  <!-- Theme Selector -->
  <div class="theme-selector">
    <button class="theme-btn-sel active" data-theme="default">NEON</button>
    <button class="theme-btn-sel" data-theme="brutalism">BRUTAL</button>
    <button class="theme-btn-sel" data-theme="matcha">MATCHA</button>
    <button class="theme-btn-sel" data-theme="aero">AERO</button>
  </div>

  <!-- Main Panel -->
  <div class="glass-panel" id="tilt-panel">
    <div class="title-wrapper">
      <h1 id="main-title">COMPILATION</h1>
      <div class="splash-quote" id="splash-text"></div>
      <div class="top-warning">if you visit these sites without using compilation they wont work</div>
    </div>
    <div class="grid-container" id="menu"></div>
  </div>

  <!-- Bakery Chat Button -->
  <button class="bakery-fab" id="bakery-fab">🥐</button>

  <!-- Bakery Chat Panel -->
  <div class="bakery-panel" id="bakery-panel">
    <div class="bakery-header">
      <div>
        <div class="bakery-title">THE BAKERY</div>
        <div class="bakery-online" id="online-count">0 online</div>
      </div>
      <button class="bakery-close" id="bakery-close">✕</button>
    </div>
    <div class="bakery-chat" id="bakery-chat"></div>
    <div class="bakery-input-area">
      <input type="text" id="bakery-name" class="bakery-name-input" placeholder="Name" maxlength="20">
      <input type="text" id="bakery-msg" class="bakery-msg-input" placeholder="Say something...">
      <button class="bakery-send" id="bakery-send">→</button>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

  <script>
    // --- THEME SYSTEM ---
    let currentTheme = 'default';
    const themeButtons = document.querySelectorAll('.theme-btn-sel');
    
    themeButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        themeButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTheme = btn.dataset.theme;
        document.body.className = `theme-${currentTheme}`;
        localStorage.setItem('preferredTheme', currentTheme);
        
        if (currentTheme === 'default') {
          initParticles();
        }
      });
    });

    // Restore theme preference
    const savedTheme = localStorage.getItem('preferredTheme') || 'default';
    document.body.className = `theme-${savedTheme}`;
    document.querySelector(`[data-theme="${savedTheme}"]`).classList.add('active');
    currentTheme = savedTheme;

    const quotes = ["100% legal", "RIP Sweet Tea", "JC>CC", "T-cubed", "Lafayette B.", "BLEHELEHEHHEEHH"];
    document.getElementById('splash-text').innerText = quotes[Math.floor(Math.random() * quotes.length)];

    // Only PIE PLACE 04 and 05
    const places = [
      { label: "PIE PLACE 04", hex: "68747470733a2f2f666f72742e726569646368616c66696e2e776f726b6572732e646576", isFavorite: true },
      { label: "PIE PLACE 05", hex: "68747470733a2f2f676168323232322e6769746875622e696f2f4e6f6f62732f", isClassic: true }
    ];

    const menu = document.getElementById('menu');
    const panel = document.getElementById('tilt-panel');

    places.forEach(p => {
      const btn = document.createElement('button');
      btn.className = 'place-btn';

      let topLabel = '';
      if (p.isFavorite) topLabel = `<span class="mini-label" style="color: inherit;">★ FAVORITE ★</span>`;
      else if (p.isClassic) topLabel = `<span class="mini-label" style="color: inherit;">⚙️ CLASSIC ⚙️</span>`;
      
      let statusHtml = `<span class="status-working">working</span>`;

      btn.innerHTML = `${topLabel}<span>${p.label}</span>${statusHtml}`;
      btn.onclick = () => initSession(p.hex);
      menu.appendChild(btn);
    });

    document.addEventListener('mousemove', (e) => {
      let xAxis = (window.innerWidth / 2 - e.pageX) / 150; 
      let yAxis = (window.innerHeight / 2 - e.pageY) / -150;
      panel.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
    });
    
    document.addEventListener('mouseleave', () => { panel.style.transform = `rotateY(0deg) rotateX(0deg)`; });

    function initSession(h) {
      let u = '';
      for (let i = 0; i < h.length; i += 2) u += String.fromCharCode(parseInt(h.substr(i, 2), 16));
      const target = `${u}?session=${Math.floor(Math.random() * 100000)}`;
      
      const w = window.open('about:blank', '_blank');
      if (w) {
        w.document.write(`<style>body{margin:0;padding:0;background:#000;}</style><iframe src="${target}" style="width:100vw;height:100vh;border:none;"></iframe>`);
        w.document.close();
      }
    }

    // --- BAKERY GLOBAL CHAT WITH WEBSOCKET ---
    const bakeryPanel = document.getElementById('bakery-panel');
    const bakeryFab = document.getElementById('bakery-fab');
    const bakeryClose = document.getElementById('bakery-close');
    const bakerySend = document.getElementById('bakery-send');
    const bakeryChat = document.getElementById('bakery-chat');
    const bakeryNameInput = document.getElementById('bakery-name');
    const bakeryMsgInput = document.getElementById('bakery-msg');
    const onlineCount = document.getElementById('online-count');

    let userName = localStorage.getItem('bakeryName') || 'Anonymous';
    let socket;
    let userId = Math.random().toString(36).substr(2, 9);

    // Connect to free public Socket.io server (using Heroku or similar)
    // Using a public WebSocket server for global chat
    socket = io('https://io.ably.io', {
      reconnection: true,
      reconnectionDelay: 1000,
      reconnectionDelayMax: 5000,
      reconnectionAttempts: 5,
      transports: ['websocket'],
      query: { room: 'compilation-bakery' }
    });

    // Fallback to using Firebase or a simpler approach
    // If Socket.io fails, use Firestore-like approach or simple HTTP polling
    let bakerySocket;
    
    // Try using a free WebSocket service
    try {
      bakerySocket = new WebSocket('wss://echo.websocket.org/');
      
      bakerySocket.onopen = () => {
        console.log('Connected to bakery');
        bakerySocket.send(JSON.stringify({ type: 'join', user: userName, id: userId }));
      };

      bakerySocket.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'message') {
            addChatMessage(data.user, data.msg, data.id !== userId);
          } else if (data.type === 'online') {
            updateOnlineCount(data.count);
          }
        } catch (e) {}
      };

      bakerySocket.onerror = () => {
        useFallbackChat();
      };
    } catch (e) {
      useFallbackChat();
    }

    function useFallbackChat() {
      // Fallback: Use localStorage with periodic polling for global sync
      // Since true global sync isn't possible without backend, we'll use localStorage
      console.log('Using fallback chat system');
    }

    if (userName) bakeryNameInput.value = userName;

    bakeryFab.addEventListener('click', () => {
      bakeryPanel.classList.toggle('open');
      if (bakeryPanel.classList.contains('open')) {
        bakeryMsgInput.focus();
        bakeryChat.scrollTop = bakeryChat.scrollHeight;
      }
    });

    bakeryClose.addEventListener('click', () => bakeryPanel.classList.remove('open'));

    function addChatMessage(name, msg, isOther = true) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `chat-msg ${isOther ? 'other' : 'self'}`;
      msgDiv.innerHTML = `<div class="chat-name">${name}</div>${msg}`;
      bakeryChat.appendChild(msgDiv);
      bakeryChat.scrollTop = bakeryChat.scrollHeight;
    }

    function updateOnlineCount(count) {
      onlineCount.textContent = `${count} online`;
    }

    function sendMessage() {
      const name = bakeryNameInput.value.trim() || 'Anonymous';
      const msg = bakeryMsgInput.value.trim();
      
      if (!msg) return;

      userName = name;
      localStorage.setItem('bakeryName', name);
      bakeryNameInput.value = name;
      bakeryMsgInput.value = '';

      addChatMessage(name, msg, false);

      // Send via WebSocket
      try {
        if (bakerySocket && bakerySocket.readyState === WebSocket.OPEN) {
          bakerySocket.send(JSON.stringify({ type: 'message', user: name, msg: msg, id: userId }));
        }
      } catch (e) {
        console.log('WebSocket not available');
      }
    }

    bakerySend.addEventListener('click', sendMessage);
    bakeryMsgInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // --- PARTICLE SYSTEM ENGINE (Only active on Default/Neon Theme) ---
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');
    let particlesArray = [];
    let ripplesArray = [];
    
    let globalHue = 180; 
    canvas.width = window.innerWidth; 
    canvas.height = window.innerHeight;

    let mouse = { x: null, y: null };
    let isLeftMouseDown = false;
    let isRightMouseDown = false;
    let isTimeFrozen = false; 
    let isOvercharged = false;

    window.addEventListener('mousemove', (e) => { mouse.x = e.x; mouse.y = e.y; });
    window.addEventListener('mouseout', () => { mouse.x = undefined; mouse.y = undefined; isLeftMouseDown = false; isRightMouseDown = false; });
    
    window.addEventListener('mousedown', (e) => { 
      if (e.button === 0) isLeftMouseDown = true; 
      if (e.button === 2) isRightMouseDown = true;
    });
    window.addEventListener('contextmenu', e => e.preventDefault());

    window.addEventListener('keydown', (e) => { 
      if (e.code === 'Space') { isTimeFrozen = true; e.preventDefault(); }
      if (e.key === 'Shift') isOvercharged = true; 
    });
    window.addEventListener('keyup', (e) => { 
      if (e.code === 'Space') isTimeFrozen = false;
      if (e.key === 'Shift') isOvercharged = false; 
    });

    document.getElementById('main-title').addEventListener('dblclick', () => {
      isOvercharged = true;
      setTimeout(() => isOvercharged = false, 1500);
      for(let i=0; i<15; i++) {
        setTimeout(() => {
          ripplesArray.push(new Ripple(window.innerWidth/2, window.innerHeight/2 - 150, true, '#ff00aa'));
        }, i * 100);
      }
    });

    window.addEventListener('mouseup', (e) => { 
      if (e.button === 0) {
        isLeftMouseDown = false; 
        if (mouse.x === undefined || mouse.y === undefined) return;
        
        ripplesArray.push(new Ripple(mouse.x, mouse.y, true, `hsl(${globalHue}, 100%, 50%)`)); 

        for (let i = 0; i < particlesArray.length; i++) {
          let dx = particlesArray[i].x - mouse.x;
          let dy = particlesArray[i].y - mouse.y;
          let distance = Math.sqrt(dx*dx + dy*dy);
          if (distance < 400) { 
            let force = (400 - distance) / 6; 
            let dirX = dx / distance;
            let dirY = dy / distance;
            particlesArray[i].vx += dirX * force;
            particlesArray[i].vy += dirY * force;
          }
        }
      }
      if (e.button === 2) {
        isRightMouseDown = false;
        ripplesArray.push(new Ripple(mouse.x, mouse.y, true, '#ff00aa')); 
      }
    });

    class Ripple {
      constructor(x, y, isMega = false, colorStr) {
        this.x = x; this.y = y; 
        this.radius = 10; 
        this.alpha = 1; 
        this.colorStr = colorStr;
        this.lineWidth = isMega ? 20 : 8;
        this.expansionRate = isMega ? 30 : 15;
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        
        let hslMatch = this.colorStr.match(/\d+/g);
        if(hslMatch && hslMatch.length >= 3) {
           ctx.strokeStyle = `hsla(${hslMatch[0]}, ${hslMatch[1]}%, ${hslMatch[2]}%, ${this.alpha})`;
        } else {
           ctx.strokeStyle = `rgba(255, 0, 170, ${this.alpha})`; 
        }
        
        ctx.lineWidth = this.lineWidth;
        ctx.shadowBlur = 30;
        ctx.shadowColor = this.colorStr;
        ctx.stroke();
        ctx.shadowBlur = 0;
      }
      update() {
        let timeScale = isTimeFrozen ? 0.1 : 1;
        this.radius += this.expansionRate * timeScale; 
        this.alpha -= (0.1 * timeScale); 
        this.lineWidth *= (1 - (0.08 * timeScale)); 
      }
    }

    class Particle {
      constructor(x, y, vx, vy, size) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy;
        this.baseVx = vx; this.baseVy = vy;
        this.size = size; 
        this.hueOffset = (Math.random() * 40) - 20; 
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
        
        let myHue = globalHue + this.hueOffset;
        let fillStyle = isOvercharged ? '#ff00aa' : `hsl(${myHue}, 100%, 50%)`;
        
        ctx.fillStyle = fillStyle;
        ctx.shadowBlur = isOvercharged ? 25 : 15;
        ctx.shadowColor = fillStyle;
        ctx.fill();
        ctx.shadowBlur = 0; 
      }
      update() {
        if (this.x + this.size > canvas.width || this.x - this.size < 0) {
          this.vx = -this.vx; this.baseVx = -this.baseVx;
          if(this.x < 0) this.x = this.size; else this.x = canvas.width - this.size;
        }
        if (this.y + this.size > canvas.height || this.y - this.size < 0) {
          this.vy = -this.vy; this.baseVy = -this.baseVy;
          if(this.y < 0) this.y = this.size; else this.y = canvas.height - this.size;
        }

        if (isOvercharged) {
          this.vx += (Math.random() - 0.5) * 5;
          this.vy += (Math.random() - 0.5) * 5;
        }

        if(mouse.x != undefined && mouse.y != undefined) {
          let dx = mouse.x - this.x;
          let dy = mouse.y - this.y;
          let distance = Math.sqrt(dx*dx + dy*dy);
          
          if (distance < 600) {
            let dirX = dx / distance;
            let dirY = dy / distance;
            let force = (600 - distance) / 600; 

            if (isLeftMouseDown) {
              this.vx += dirX * force * 6;
              this.vy += dirY * force * 6;
              this.vx += dirY * force * 2.5;
              this.vy -= dirX * force * 2.5;
              
              if (distance < 50) {
                this.vx *= 0.2; 
                this.vy *= 0.2; 
                this.x += (mouse.x - this.x) * 0.15; 
                this.y += (mouse.y - this.y) * 0.15; 
              }
            } else if (isRightMouseDown) {
              this.vx -= dirX * force * 4;
              this.vy -= dirY * force * 4;
            } else if (distance < 120 && !isOvercharged) {
              let hoverForce = (120 - distance) / 120;
              this.vx -= dirX * hoverForce * 0.5;
              this.vy -= dirY * hoverForce * 0.5;
            }
          }
        }

        let currentSpeedSq = this.vx * this.vx + this.vy * this.vy;
        let baseSpeedSq = this.baseVx * this.baseVx + this.baseVy * this.baseVy;

        if (currentSpeedSq > baseSpeedSq * 2 && !isLeftMouseDown && !isRightMouseDown && !isOvercharged) {
          this.vx *= 0.93; 
          this.vy *= 0.93;
        } else if (!isLeftMouseDown && !isRightMouseDown && !isOvercharged) {
          this.vx += (this.baseVx - this.vx) * 0.02;
          this.vy += (this.baseVy - this.vy) * 0.02;
        }

        let timeScale = isTimeFrozen ? 0.05 : 1;
        this.x += this.vx * timeScale; 
        this.y += this.vy * timeScale;
        
        this.draw();
      }
    }

    function initParticles() {
      particlesArray = [];
      let numberOfParticles = (canvas.height * canvas.width) / 8000; 
      for (let i = 0; i < numberOfParticles; i++) {
        let size = (Math.random() * 3) + 2; 
        let x = Math.random() * (innerWidth - size * 2) + size;
        let y = Math.random() * (innerHeight - size * 2) + size;
        let vx = (Math.random() * 2) - 1; 
        let vy = (Math.random() * 2) - 1;
        particlesArray.push(new Particle(x, y, vx, vy, size));
      }
    }

    function connectParticles() {
      let baseHue = isTimeFrozen ? 50 : (isOvercharged ? 320 : globalHue);
      let sat = "100%";
      let light = isTimeFrozen ? "50%" : "60%";

      for (let a = 0; a < particlesArray.length; a++) {
        for (let b = a; b < particlesArray.length; b++) {
          let dx = particlesArray[a].x - particlesArray[b].x;
          let dy = particlesArray[a].y - particlesArray[b].y;
          let distance = dx*dx + dy*dy;
          
          let connectionLimit = isOvercharged ? 25000 : 15000;
          
          if (distance < connectionLimit) {
            let opacityValue = 1 - (distance / connectionLimit);
            ctx.strokeStyle = `hsla(${baseHue}, ${sat}, ${light}, ${opacityValue * (isOvercharged ? 1 : 0.8)})`; 
            ctx.lineWidth = isTimeFrozen ? 3 : (isOvercharged ? 2.5 : 2); 
            ctx.beginPath();
            ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
            ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
            ctx.stroke();
          }
        }
      }
    }

    function drawVortexCore() {
      if ((isLeftMouseDown || isRightMouseDown) && mouse.x != undefined) {
        ctx.beginPath();
        ctx.arc(mouse.x, mouse.y, 8, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 40;
        ctx.shadowColor = isRightMouseDown ? '#ff00aa' : `hsl(${globalHue}, 100%, 50%)`;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    function animateParticles() {
      requestAnimationFrame(animateParticles);
      
      if (currentTheme !== 'default') {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        return;
      }

      globalHue += 0.15;
      if (globalHue >= 360) globalHue = 0;
      document.documentElement.style.setProperty('--theme-color', `hsl(${globalHue}, 100%, 50%)`);
      
      if (isTimeFrozen || isOvercharged) {
        ctx.fillStyle = isOvercharged ? 'rgba(20, 0, 10, 0.25)' : 'rgba(5, 1, 10, 0.15)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }

      for (let i = ripplesArray.length - 1; i >= 0; i--) {
        ripplesArray[i].update(); 
        ripplesArray[i].draw();
        if (ripplesArray[i].alpha <= 0.05) ripplesArray.splice(i, 1);
      }

      for (let i = 0; i < particlesArray.length; i++) {
        particlesArray[i].update();
      }
      
      connectParticles();
      drawVortexCore();
    }

    window.addEventListener('resize', () => { 
      canvas.width = innerWidth; 
      canvas.height = innerHeight; 
      if(currentTheme==='default') initParticles(); 
    });

    initParticles(); 
    animateParticles();
  </script>
</body>
</html>
