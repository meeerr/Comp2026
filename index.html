<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COMPILATION</title>
<!-- Global Realtime WebSockets for The Bakery Cross-Device Chat -->
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
  :root {
    --theme-color: #00ffff;
    --theme-bg: #05010a;
    --panel-bg: rgba(5, 2, 10, 0.3);
    --cyan: #00e5ff;
    --lime: #39ff14;
    --gold: #ffd700;
    --orange: #ff6600;
    --hot-pink: #ff00aa;
    --electric-blue: #007fff;
    --magenta: #ff00ff;
    --bright-green: #32cd32;
    --neon-red: #ff073a;
    --forest-green: #228b22;
    --purple-haze: #7f00ff;
  }

  body[data-theme="matrix"] { --theme-color: #39ff14; --theme-bg: #000902; --panel-bg: rgba(0, 18, 4, 0.45); }
  body[data-theme="synthwave"] { --theme-color: #ff00aa; --theme-bg: #0c0017; --panel-bg: rgba(22, 0, 32, 0.4); }
  body[data-theme="blackhole"] { --theme-color: #ff7700; --theme-bg: #020205; --panel-bg: rgba(12, 6, 16, 0.4); }
  body[data-theme="cyberpunk"] { --theme-color: #00e5ff; --theme-bg: #030814; --panel-bg: rgba(2, 12, 28, 0.45); }
  body[data-theme="hyperspace"] { --theme-color: #9d00ff; --theme-bg: #010008; --panel-bg: rgba(10, 0, 24, 0.45); }
  body[data-theme="vapor"] { --theme-color: #ff71ce; --theme-bg: #0b001a; --panel-bg: rgba(22, 4, 32, 0.4); }

  body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    font-family: 'Courier New', Courier, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background-color: var(--theme-bg);
    overflow: hidden;
    color: white;
    perspective: 1200px;
    cursor: crosshair;
    user-select: none;
    transition: background-color 0.4s ease;
  }

  body:active { cursor: grabbing; }

  #canvas-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }

  .scanlines {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.18) 50%, rgba(0,0,0,0.18));
    background-size: 100% 4px;
    pointer-events: none;
    z-index: 1;
  }

  /* Minimalist Top-Left View Counter */
  .view-counter {
    position: fixed;
    top: 18px;
    left: 22px;
    z-index: 10;
    font-size: 11px;
    letter-spacing: 1.8px;
    color: rgba(255, 255, 255, 0.45);
    background: rgba(0, 0, 0, 0.45);
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.3s ease;
  }

  .view-counter:hover {
    color: #fff;
    border-color: var(--theme-color);
    box-shadow: 0 0 12px var(--theme-color);
  }

  .counter-dot {
    width: 6px;
    height: 6px;
    background: var(--theme-color);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--theme-color);
    animation: counterBlink 2s infinite alternate;
  }

  .counter-val {
    color: var(--theme-color);
    font-weight: bold;
  }

  @keyframes counterBlink {
    0% { opacity: 0.3; }
    100% { opacity: 1; }
  }

  @keyframes panelGlow {
    0% { box-shadow: 0 30px 60px rgba(0,0,0,0.9), inset 0 0 20px rgba(255,255,255,0.05), 0 0 15px rgba(255,255,255,0.1); }
    100% { box-shadow: 0 30px 60px rgba(0,0,0,0.9), inset 0 0 20px rgba(255,255,255,0.05), 0 0 40px var(--theme-color); }
  }

  .glass-panel {
    position: relative;
    z-index: 2;
    background: var(--panel-bg); 
    backdrop-filter: blur(14px) saturate(180%);
    -webkit-backdrop-filter: blur(14px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 16px;
    padding: 30px 40px;
    width: 780px;
    max-width: 92%;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: transform 0.1s ease-out, box-shadow 0.3s ease, background 0.4s ease;
    transform-style: preserve-3d;
    animation: panelGlow 3s infinite alternate ease-in-out;
  }

  .title-wrapper {
    position: relative;
    margin: 0 0 16px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .top-warning {
    margin-top: 12px;
    font-size: 11.5px;
    color: var(--orange);
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    text-shadow: 0 0 8px rgba(255, 102, 0, 0.6);
  }

  h1 {
    margin: 0;
    font-weight: 900;
    letter-spacing: 12px;
    font-size: 4.2rem; 
    color: #fff;
    text-transform: uppercase;
    text-align: center;
    text-shadow: 
      0 0 5px rgba(255,255,255,0.8),
      0 0 15px var(--theme-color),
      0 0 30px var(--theme-color);
    transition: all 0.3s ease;
    cursor: pointer;
  }

  h1:hover {
    letter-spacing: 15px;
    transform: scale(1.02);
    text-shadow: 
      0 0 10px rgba(255,255,255,1),
      0 0 25px var(--theme-color),
      0 0 50px var(--theme-color);
  }

  .splash-quote {
    position: absolute;
    top: -15px;
    right: -80px; 
    color: #ffea00;
    font-weight: 900;
    font-size: 17px; 
    text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 0 0 10px rgba(255, 234, 0, 0.6);
    transform: rotate(-15deg);
    pointer-events: auto;
    cursor: crosshair;
    animation: splashBounce 0.4s infinite alternate ease-in-out;
    white-space: nowrap;
    transition: transform 0.2s;
  }

  .splash-quote:hover {
    animation: none;
    transform: scale(1.2) rotate(10deg);
    color: var(--theme-color);
    text-shadow: 1px 1px 0 #000, 0 0 15px var(--theme-color);
  }

  @keyframes splashBounce {
    0% { transform: scale(1) rotate(-15deg); }
    100% { transform: scale(1.05) rotate(-15deg); }
  }

  /* Theme Switcher Bar */
  .theme-bar {
    display: flex;
    gap: 7px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    justify-content: center;
    z-index: 5;
  }

  .theme-pill {
    background: rgba(0, 0, 0, 0.6);
    border: 1px solid rgba(255,255,255,0.2);
    color: #bbb;
    font-family: inherit;
    font-size: 9.5px;
    letter-spacing: 1.2px;
    padding: 6px 11px;
    border-radius: 20px;
    cursor: crosshair;
    transition: all 0.25s ease;
    text-transform: uppercase;
  }

  .theme-pill:hover, .theme-pill.active {
    color: #000;
    background: var(--theme-color);
    border-color: var(--theme-color);
    box-shadow: 0 0 14px var(--theme-color);
    font-weight: bold;
    transform: translateY(-1px);
  }

  .grid-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    width: 100%;
    padding: 5px 0;
    transform: translateZ(25px);
  }

  .place-btn {
    background: rgba(0, 0, 0, 0.65);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #e0e0e0;
    padding: 18px 12px;
    font-size: 15px; 
    font-family: inherit;
    font-weight: bold;
    letter-spacing: 2px; 
    cursor: crosshair;
    border-radius: 8px;
    transition: all 0.3s ease-out;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    overflow: hidden;
    text-align: center;
  }

  .place-btn > * { position: relative; z-index: 1; }

  .place-btn:hover {
    background: rgba(255, 255, 255, 0.1);
    transform: scale(1.03);
    border-color: rgba(255, 255, 255, 0.5);
  }

  .place-btn.is-gold { border-color: var(--gold); }
  .place-btn.is-bright-green { border-color: var(--bright-green); }
  .place-btn.is-cyan { border-color: var(--cyan); }

  .place-btn.is-gold:hover { box-shadow: 0 0 20px 5px rgba(255, 215, 0, 0.7); }
  .place-btn.is-bright-green:hover { box-shadow: 0 0 20px 5px rgba(50, 205, 50, 0.7); }
  .place-btn.is-cyan:hover { box-shadow: 0 0 20px 5px rgba(0, 229, 255, 0.7); }

  .mini-label {
    font-size: 10px;
    margin-bottom: 5px;
    letter-spacing: 1px;
    text-shadow: 0 0 8px currentColor;
    animation: pulseBadge 1.5s infinite alternate ease-in-out;
  }

  @keyframes pulseBadge {
    0% { opacity: 0.7; transform: scale(0.98); }
    100% { opacity: 1; transform: scale(1.02); }
  }

  .status-working {
    font-size: 10.5px;
    color: rgba(255, 255, 255, 0.4);
    margin-top: 5px;
    letter-spacing: 1px;
    font-weight: normal;
  }
  .place-btn:hover .status-working { color: rgba(255, 255, 255, 0.95); }

  /* More sites coming soon notice */
  .coming-soon-notice {
    margin-top: 14px;
    font-size: 11px;
    letter-spacing: 2px;
    color: rgba(255, 255, 255, 0.5);
    text-transform: uppercase;
    text-align: center;
    transition: color 0.3s;
  }
  .coming-soon-notice:hover {
    color: var(--theme-color);
    text-shadow: 0 0 8px var(--theme-color);
  }

  /* Bakery Toggle Button */
  .bakery-toggle-btn {
    margin-top: 14px;
    width: 100%;
    background: rgba(0, 0, 0, 0.75);
    border: 1px dashed var(--theme-color);
    color: #fff;
    padding: 13px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: bold;
    letter-spacing: 2px;
    cursor: crosshair;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .bakery-toggle-btn:hover {
    background: var(--theme-color);
    color: #000;
    box-shadow: 0 0 25px var(--theme-color);
    border-style: solid;
  }

  .oven-dot {
    width: 8px;
    height: 8px;
    background: #39ff14;
    border-radius: 50%;
    box-shadow: 0 0 10px #39ff14;
    animation: ovenPulse 1s infinite alternate;
  }

  @keyframes ovenPulse {
    0% { opacity: 0.3; transform: scale(0.8); }
    100% { opacity: 1; transform: scale(1.2); }
  }

  /* THE BAKERY GLOBAL CHAT DRAWER */
  .bakery-chat-panel {
    position: fixed;
    right: -450px;
    top: 0;
    width: 420px;
    max-width: 95vw;
    height: 100vh;
    background: rgba(4, 1, 10, 0.92);
    backdrop-filter: blur(24px) saturate(200%);
    -webkit-backdrop-filter: blur(24px) saturate(200%);
    border-left: 2px solid var(--theme-color);
    box-shadow: -15px 0 45px rgba(0,0,0,0.9), 0 0 25px var(--theme-color);
    z-index: 100;
    transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex;
    flex-direction: column;
  }

  .bakery-chat-panel.open { right: 0; }

  .chat-header {
    padding: 16px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.12);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,0,0,0.5);
  }

  .chat-title {
    font-weight: 900;
    letter-spacing: 1.5px;
    color: #fff;
    font-size: 14.5px;
    display: flex;
    align-items: center;
    gap: 9px;
    text-shadow: 0 0 10px var(--theme-color);
  }

  .chat-status-text {
    font-size: 11px;
    color: var(--lime);
    letter-spacing: 1px;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .chat-close-btn {
    background: transparent;
    border: none;
    color: #aaa;
    font-size: 22px;
    cursor: crosshair;
    font-family: inherit;
    transition: color 0.2s;
  }
  .chat-close-btn:hover { color: var(--theme-color); }

  .chat-user-bar {
    padding: 10px 18px;
    background: rgba(0,0,0,0.35);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11.5px;
  }

  .chat-user-input {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    color: var(--theme-color);
    padding: 4px 8px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 12px;
    width: 150px;
    outline: none;
  }

  .chat-user-input:focus { border-color: var(--theme-color); }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 15px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    font-size: 13px;
  }

  .chat-messages::-webkit-scrollbar { width: 4px; }
  .chat-messages::-webkit-scrollbar-thumb { background: var(--theme-color); border-radius: 2px; }

  .chat-bubble {
    background: rgba(255, 255, 255, 0.04);
    border-left: 2px solid var(--theme-color);
    padding: 9px 12px;
    border-radius: 0 8px 8px 0;
    word-break: break-word;
    animation: msgFade 0.2s ease-out;
  }

  @keyframes msgFade {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .chat-msg-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
    font-size: 11px;
  }

  .chat-msg-user { font-weight: bold; color: var(--theme-color); }
  .chat-msg-time { color: rgba(255,255,255,0.4); font-size: 10px; }
  .chat-msg-text { color: #eee; line-height: 1.4; }

  .chat-input-area {
    padding: 14px 18px;
    border-top: 1px solid rgba(255,255,255,0.1);
    display: flex;
    gap: 8px;
    background: rgba(0,0,0,0.6);
  }

  .chat-msg-input {
    flex: 1;
    background: rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    padding: 10px 12px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 13px;
    outline: none;
  }

  .chat-msg-input:focus {
    border-color: var(--theme-color);
    box-shadow: 0 0 8px var(--theme-color);
  }

  .chat-send-btn {
    background: var(--theme-color);
    color: #000;
    border: none;
    padding: 0 16px;
    border-radius: 6px;
    font-weight: bold;
    font-family: inherit;
    cursor: crosshair;
    transition: all 0.2s;
  }

  .chat-send-btn:hover {
    box-shadow: 0 0 12px var(--theme-color);
    transform: scale(1.04);
  }

  /* STARTUP ANIMATION OVERLAY */
  #startup-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background: #010004;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 0.4s ease-out;
    pointer-events: auto;
  }

  .startup-loader {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .startup-logo {
    font-size: 40px;
    font-weight: 900;
    letter-spacing: 16px;
    color: #fff;
    text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
    animation: bootGlitch 0.6s infinite alternate;
  }

  .startup-bar-container {
    width: 280px;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }

  .startup-bar-fill {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    width: 0%;
    background: var(--theme-color);
    box-shadow: 0 0 10px var(--theme-color);
    animation: bootFill 1.1s cubic-bezier(0.1, 0.7, 0.1, 1) forwards;
  }

  .startup-sub {
    font-size: 11px;
    letter-spacing: 3px;
    color: rgba(255,255,255,0.6);
    text-transform: uppercase;
  }

  @keyframes bootFill {
    0% { width: 0%; }
    50% { width: 60%; }
    100% { width: 100%; }
  }

  @keyframes bootGlitch {
    0% { opacity: 0.9; transform: skew(0deg); }
    50% { opacity: 1; transform: skew(-1deg); }
    100% { opacity: 0.8; transform: skew(1deg); }
  }

  .test-tool { position: absolute; bottom: 15px; z-index: 10; opacity: 0.2; transition: opacity 0.3s; display: flex; gap: 10px; }
  .test-tool:hover { opacity: 1; }
  .test-input { background: #111; border: 1px solid #444; color: white; padding: 8px; border-radius: 4px; font-family: inherit; width: 180px; cursor: text;}
  .test-btn { background: #222; border: 1px solid #666; color: #fff; cursor: crosshair; padding: 0 12px; border-radius: 4px; font-family: inherit; transition: all 0.2s;}
  .test-btn:hover { background: var(--theme-color); color: #000; border-color: var(--theme-color); box-shadow: 0 0 15px var(--theme-color); }
</style>
</head>
<body data-theme="dynamic">

  <!-- Minimal Top Left View Counter -->
  <div class="view-counter" id="view-counter-box" title="Total Site Views">
    <span class="counter-dot"></span>
    <span>VIEWS:</span>
    <span class="counter-val" id="view-counter-val">1,348</span>
  </div>

  <!-- Startup Boot Overlay -->
  <div id="startup-overlay" onclick="dismissStartup()">
    <div class="startup-loader">
      <div class="startup-logo">COMPILATION</div>
      <div class="startup-bar-container">
        <div class="startup-bar-fill"></div>
      </div>
      <div class="startup-sub" id="boot-status">INITIALIZING QUANTUM KERNEL...</div>
    </div>
  </div>

  <canvas id="canvas-bg"></canvas>
  <div class="scanlines"></div>

  <div class="glass-panel" id="tilt-panel">
    <div class="title-wrapper">
      <h1 id="main-title">COMPILATION</h1>
      <div class="splash-quote" id="splash-text"></div>
      <div class="top-warning">if you visit these sites without using compilation they wont work when you try again</div>
    </div>

    <!-- 6 Epic Interactive Themes -->
    <div class="theme-bar">
      <button class="theme-pill active" onclick="setTheme('dynamic', this)">Dynamic RGB</button>
      <button class="theme-pill" onclick="setTheme('matrix', this)">Matrix Rain</button>
      <button class="theme-pill" onclick="setTheme('synthwave', this)">Synthwave '84</button>
      <button class="theme-pill" onclick="setTheme('blackhole', this)">Black Hole</button>
      <button class="theme-pill" onclick="setTheme('cyberpunk', this)">Cyber Storm</button>
      <button class="theme-pill" onclick="setTheme('hyperspace', this)">Hyperspace</button>
      <button class="theme-pill" onclick="setTheme('vapor', this)">Arcade Vapor</button>
    </div>

    <!-- Places (4, 5, and Google Doc) -->
    <div class="grid-container" id="menu"></div>

    <!-- More Sites Coming Soon Notice -->
    <div class="coming-soon-notice">► more sites coming soon ◄</div>

    <!-- The Bakery (live chat) Launcher Button -->
    <button class="bakery-toggle-btn" onclick="toggleBakeryChat()">
      <span class="oven-dot"></span>
      <span>The bakery (live chat)</span>
    </button>
  </div>

  <!-- THE BAKERY DRAWER -->
  <div class="bakery-chat-panel" id="bakery-panel">
    <div class="chat-header">
      <div class="chat-title">
        <span class="oven-dot"></span>
        <span>The bakery (live chat)</span>
      </div>
      <span class="chat-status-text" id="chat-conn-status">Online: ● CONNECTED</span>
      <button class="chat-close-btn" onclick="toggleBakeryChat()">✕</button>
    </div>
    <div class="chat-user-bar">
      <span>HANDLE:</span>
      <input type="text" id="chatHandle" class="chat-user-input" maxlength="15" placeholder="Baker_#">
    </div>
    <div class="chat-messages" id="chatList"></div>
    <div class="chat-input-area">
      <input type="text" id="chatInput" class="chat-msg-input" placeholder="Bake a message..." maxlength="200" onkeydown="handleChatKey(event)">
      <button class="chat-send-btn" onclick="sendBakeryMessage()">SEND</button>
    </div>
  </div>

  <div class="test-tool">
    <input type="text" id="testUrl" class="test-input" placeholder="URL to Hex">
    <button onclick="testLink()" class="test-btn">ENCODE</button>
  </div>

  <script>
    /* VIEW COUNTER LOGIC */
    async function initViewCounter() {
      const counterEl = document.getElementById('view-counter-val');
      let baseCount = parseInt(localStorage.getItem('compilation_views_count') || '1348', 10) + 1;
      localStorage.setItem('compilation_views_count', baseCount);
      counterEl.innerText = baseCount.toLocaleString();

      try {
        const res = await fetch('https://api.counterapi.dev/v1/compilation_site_views_v6/views/up');
        if (res.ok) {
          const data = await res.json();
          if (data && data.count) {
            const total = data.count + 1300;
            counterEl.innerText = total.toLocaleString();
          }
        }
      } catch (err) {
        // Fallback to locally incremented base count seamlessly
      }
    }
    initViewCounter();

    /* STARTUP SEQUENCE */
    function dismissStartup() {
      const overlay = document.getElementById('startup-overlay');
      if (overlay && overlay.style.display !== 'none') {
        overlay.style.opacity = '0';
        setTimeout(() => { overlay.style.display = 'none'; }, 400);
      }
    }
    setTimeout(() => {
      const status = document.getElementById('boot-status');
      if(status) status.innerText = "SYSTEMS READY • ACCESS GRANTED";
    }, 600);
    setTimeout(dismissStartup, 1300);
    window.addEventListener('keydown', (e) => { if(e.key === 'Escape') dismissStartup(); });

    /* PLACES CONFIGURATION */
    const places = [

    /* 1. ORIGINAL DYNAMIC PARTICLE ENGINE (RESTORED 100%) */
    let particlesArray = [];
    let ripplesArray = []; 

    class Ripple {
      constructor(x, y, isMega = false, colorStr) {
        this.x = x; this.y = y; 
        this.radius = 10; 
        this.alpha = 1; 
        this.colorStr = colorStr;
        this.lineWidth = isMega ? 20 : 8;
        this.expansionRate = isMega ? 30 : 15;
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        
        let hslMatch = this.colorStr.match(/\d+/g);
        if(hslMatch && hslMatch.length >= 3) {
           ctx.strokeStyle = `hsla(${hslMatch[0]}, ${hslMatch[1]}%, ${hslMatch[2]}%, ${this.alpha})`;
        } else {
           ctx.strokeStyle = `rgba(255, 0, 170, ${this.alpha})`; 
        }
        
        ctx.lineWidth = this.lineWidth;
        ctx.shadowBlur = 30;
        ctx.shadowColor = this.colorStr;
        ctx.stroke();
        ctx.shadowBlur = 0;
      }
      update() {
        let timeScale = isTimeFrozen ? 0.1 : 1;
        this.radius += this.expansionRate * timeScale; 
        this.alpha -= (0.1 * timeScale); 
        this.lineWidth *= (1 - (0.08 * timeScale)); 
      }
    }

    class Particle {
      constructor(x, y, vx, vy, size) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy;
        this.baseVx = vx; this.baseVy = vy;
        this.size = size; 
        this.hueOffset = (Math.random() * 40) - 20; 
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
        
        let myHue = globalHue + this.hueOffset;
        let fillStyle = isOvercharged ? '#ff00aa' : `hsl(${myHue}, 100%, 50%)`;
        
        ctx.fillStyle = fillStyle;
        ctx.shadowBlur = isOvercharged ? 25 : 15;
        ctx.shadowColor = fillStyle;
        ctx.fill();
        ctx.shadowBlur = 0; 
      }
      update() {
        if (this.x + this.size > canvas.width || this.x - this.size < 0) {
          this.vx = -this.vx; this.baseVx = -this.baseVx;
          if(this.x < 0) this.x = this.size; else this.x = canvas.width - this.size;
        }
        if (this.y + this.size > canvas.height || this.y - this.size < 0) {
          this.vy = -this.vy; this.baseVy = -this.baseVy;
          if(this.y < 0) this.y = this.size; else this.y = canvas.height - this.size;
        }

        if (isOvercharged) {
          this.vx += (Math.random() - 0.5) * 5;
          this.vy += (Math.random() - 0.5) * 5;
        }

        if(mouse.x != undefined && mouse.y != undefined) {
          let dx = mouse.x - this.x;
          let dy = mouse.y - this.y;
          let distance = Math.sqrt(dx*dx + dy*dy);
          
          if (distance < 600) {
            let dirX = dx / distance;
            let dirY = dy / distance;
            let force = (600 - distance) / 600; 

            if (isLeftMouseDown) {
              this.vx += dirX * force * 6;
              this.vy += dirY * force * 6;
              this.vx += dirY * force * 2.5;
              this.vy -= dirX * force * 2.5;
              
              if (distance < 50) {
                this.vx *= 0.2; 
                this.vy *= 0.2; 
                this.x += (mouse.x - this.x) * 0.15; 
                this.y += (mouse.y - this.y) * 0.15; 
              }
            } else if (isRightMouseDown) {
              this.vx -= dirX * force * 4;
              this.vy -= dirY * force * 4;
            } else if (distance < 120 && !isOvercharged) {
              let hoverForce = (120 - distance) / 120;
              this.vx -= dirX * hoverForce * 0.5;
              this.vy -= dirY * hoverForce * 0.5;
            }
          }
        }

        let currentSpeedSq = this.vx * this.vx + this.vy * this.vy;
        let baseSpeedSq = this.baseVx * this.baseVx + this.baseVy * this.baseVy;

        if (currentSpeedSq > baseSpeedSq * 2 && !isLeftMouseDown && !isRightMouseDown && !isOvercharged) {
          this.vx *= 0.93; 
          this.vy *= 0.93;
        } else if (!isLeftMouseDown && !isRightMouseDown && !isOvercharged) {
          this.vx += (this.baseVx - this.vx) * 0.02;
          this.vy += (this.baseVy - this.vy) * 0.02;
        }

        let timeScale = isTimeFrozen ? 0.05 : 1;
        this.x += this.vx * timeScale; 
        this.y += this.vy * timeScale;
        
        this.draw();
      }
    }

    function initParticles() {
      particlesArray = [];
      let numberOfParticles = (canvas.height * canvas.width) / 8000; 
      for (let i = 0; i < numberOfParticles; i++) {
        let size = (Math.random() * 3) + 2; 
        let x = Math.random() * (innerWidth - size * 2) + size;
        let y = Math.random() * (innerHeight - size * 2) + size;
        let vx = (Math.random() * 2) - 1; 
        let vy = (Math.random() * 2) - 1;
        particlesArray.push(new Particle(x, y, vx, vy, size));
      }
    }

    function connectParticles() {
      let baseHue = isTimeFrozen ? 50 : (isOvercharged ? 320 : globalHue);
      let sat = isTimeFrozen ? "100%" : "100%";
      let light = isTimeFrozen ? "50%" : "60%";

      for (let a = 0; a < particlesArray.length; a++) {
        for (let b = a; b < particlesArray.length; b++) {
          let dx = particlesArray[a].x - particlesArray[b].x;
          let dy = particlesArray[a].y - particlesArray[b].y;
          let distance = dx*dx + dy*dy;
          
          let connectionLimit = isOvercharged ? 25000 : 15000;
          
          if (distance < connectionLimit) {
            let opacityValue = 1 - (distance / connectionLimit);
            ctx.strokeStyle = `hsla(${baseHue}, ${sat}, ${light}, ${opacityValue * (isOvercharged ? 1 : 0.8)})`; 
            ctx.lineWidth = isTimeFrozen ? 3 : (isOvercharged ? 2.5 : 2); 
            ctx.beginPath();
            ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
            ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
            ctx.stroke();
          }
        }
      }
    }

    function drawVortexCore() {
      if ((isLeftMouseDown || isRightMouseDown) && mouse.x != undefined) {
        ctx.beginPath();
        ctx.arc(mouse.x, mouse.y, 8, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 40;
        ctx.shadowColor = isRightMouseDown ? '#ff00aa' : `hsl(${globalHue}, 100%, 50%)`;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    function renderDynamic() {
      globalHue += 0.15;
      if (globalHue >= 360) globalHue = 0;
      document.documentElement.style.setProperty('--theme-color', `hsl(${globalHue}, 100%, 50%)`);
      
      if (isTimeFrozen || isOvercharged) {
        ctx.fillStyle = isOvercharged ? 'rgba(20, 0, 10, 0.25)' : 'rgba(5, 1, 10, 0.15)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }

      for (let i = ripplesArray.length - 1; i >= 0; i--) {
        ripplesArray[i].update(); 
        ripplesArray[i].draw();
        if (ripplesArray[i].alpha <= 0.05) ripplesArray.splice(i, 1);
      }

      for (let i = 0; i < particlesArray.length; i++) {
        particlesArray[i].update();
      }
      
      connectParticles();
      drawVortexCore();
    }

    /* 2. INTERACTIVE MATRIX DIGITAL RAIN */
    let matrixDrops = [];
    let matrixExplosions = [];
    const matrixChars = "日ﾊﾐﾋｰｳｼﾅﾓﾆｻﾜﾂｵﾘｱﾎﾃﾏｹﾒｴｶｷﾑﾕﾗｾﾈｽﾀﾇﾍ0123456789COMPILATIONBAKERY";

    function initMatrix() {
      let cols = Math.floor(canvas.width / 16);
      matrixDrops = [];
      for (let i = 0; i < cols; i++) {
        matrixDrops[i] = { y: Math.random() * -100, speed: Math.random() * 0.7 + 0.8 };
      }
    }

    function renderMatrix() {
      ctx.fillStyle = "rgba(0, 9, 3, 0.18)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.font = "14px monospace";

      for (let i = 0; i < matrixDrops.length; i++) {
        let x = i * 16;
        let y = matrixDrops[i].y * 16;
        let text = matrixChars.charAt(Math.floor(Math.random() * matrixChars.length));
        let isNearMouse = (mouse.x && Math.abs(mouse.x - x) < 45 && Math.abs(mouse.y - y) < 45);

        if (isNearMouse) {
          ctx.fillStyle = "#ffffff";
          ctx.shadowBlur = 15;
          ctx.shadowColor = "#39ff14";
          ctx.fillText("▓", x, y);
          ctx.shadowBlur = 0;
        } else {
          ctx.fillStyle = (Math.random() > 0.88) ? "#ffffff" : "#39ff14";
          ctx.fillText(text, x, y);
          ctx.fillStyle = "rgba(0, 200, 50, 0.4)";
          ctx.fillText(text, x, y - 16);
        }

        if (y > canvas.height && Math.random() > 0.975) matrixDrops[i].y = 0;
        matrixDrops[i].y += matrixDrops[i].speed;
      }

      for (let i = matrixExplosions.length - 1; i >= 0; i--) {
        let exp = matrixExplosions[i];
        ctx.strokeStyle = `rgba(57, 255, 20, ${exp.alpha})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(exp.x, exp.y, exp.r, 0, Math.PI*2);
        ctx.stroke();
        exp.r += 12;
        exp.alpha -= 0.05;
        if (exp.alpha <= 0) matrixExplosions.splice(i, 1);
      }
    }

    /* 3. INTERACTIVE SYNTHWAVE '84 RETRO 3D HIGHWAY */
    let synthOffset = 0;
    let synthLasers = [];

    function initSynthwave() {}
    function renderSynthwave() {
      ctx.fillStyle = "#0c0018";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      let horizon = canvas.height * 0.6;
      let cx = canvas.width / 2 + (mouse.x ? (mouse.x - canvas.width/2) * 0.15 : 0);

      let sunGrad = ctx.createLinearGradient(cx, horizon - 160, cx, horizon);
      sunGrad.addColorStop(0, "#ffee00");
      sunGrad.addColorStop(0.5, "#ff007f");
      sunGrad.addColorStop(1, "#7f00ff");
      ctx.fillStyle = sunGrad;
      ctx.beginPath();
      ctx.arc(cx, horizon - 15, 130, Math.PI, 0, false);
      ctx.fill();

      ctx.fillStyle = "#0c0018";
      for (let i = 0; i < 7; i++) {
        let barY = horizon - 15 - (i * 17);
        ctx.fillRect(cx - 140, barY, 280, 3.5 + i * 1.6);
      }

      synthOffset = (synthOffset + 3) % 45;
      ctx.strokeStyle = "rgba(255, 0, 170, 0.75)";
      ctx.lineWidth = 2;

      for (let x = -canvas.width; x < canvas.width * 2; x += 70) {
        ctx.beginPath();
        ctx.moveTo(cx, horizon);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }

      for (let y = horizon; y < canvas.height; y += 12) {
        let py = y + (synthOffset * ((y - horizon) / (canvas.height - horizon)));
        if (py > canvas.height) continue;
        ctx.beginPath();
        ctx.moveTo(0, py);
        ctx.lineTo(canvas.width, py);
        ctx.stroke();
      }

      for (let i = synthLasers.length - 1; i >= 0; i--) {
        let l = synthLasers[i];
        ctx.strokeStyle = '#00ffff';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(l.x - 30, l.y);
        ctx.lineTo(l.x + 30, l.y);
        ctx.stroke();
        l.y -= 14;
        if (l.y < horizon) synthLasers.splice(i, 1);
      }
    }

    /* 4. INTERACTIVE BLACK HOLE SINGULARITY */
    let cosmicParticles = [];
    let plasmaBeams = [];

    function initBlackhole() {
      cosmicParticles = [];
      for (let i = 0; i < 400; i++) {
        cosmicParticles.push({
          angle: Math.random() * Math.PI * 2,
          radius: Math.random() * 380 + 95,
          speed: Math.random() * 0.025 + 0.012,
          size: Math.random() * 2.8 + 1,
          color: Math.random() > 0.5 ? '#ff7700' : '#ffea00'
        });
      }
    }

    function renderBlackhole() {
      ctx.fillStyle = 'rgba(2, 2, 6, 0.25)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      let targetX = mouse.x ? canvas.width/2 + (mouse.x - canvas.width/2)*0.2 : canvas.width/2;
      let targetY = mouse.y ? canvas.height/2 + (mouse.y - canvas.height/2)*0.2 : canvas.height/2;

      cosmicParticles.forEach(p => {
        p.angle += p.speed * (240 / p.radius);
        p.radius -= 0.35;
        if (p.radius < 85) p.radius = 420;

        let x = targetX + Math.cos(p.angle) * p.radius * 1.6;
        let y = targetY + Math.sin(p.angle) * p.radius * 0.7;

        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(x, y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });

      for (let i = plasmaBeams.length - 1; i >= 0; i--) {
        let b = plasmaBeams[i];
        ctx.strokeStyle = `rgba(255, 234, 0, ${b.alpha})`;
        ctx.lineWidth = b.width;
        ctx.beginPath();
        ctx.moveTo(targetX, targetY);
        ctx.lineTo(targetX + Math.cos(b.angle)*canvas.width, targetY + Math.sin(b.angle)*canvas.width);
        ctx.stroke();
        b.alpha -= 0.04;
        if (b.alpha <= 0) plasmaBeams.splice(i, 1);
      }

      ctx.beginPath();
      ctx.arc(targetX, targetY, 82, 0, Math.PI * 2);
      ctx.fillStyle = '#000000';
      ctx.shadowBlur = 45;
      ctx.shadowColor = '#ff5500';
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    /* 5. INTERACTIVE CYBERPUNK STORM */
    let rainDrops = [];
    let lightningFlash = 0;

    function initCyberpunk() {
      rainDrops = [];
      for (let i = 0; i < 260; i++) {
        rainDrops.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          l: Math.random() * 25 + 15,
          speed: Math.random() * 14 + 16
        });
      }
    }

    function renderCyberpunk() {
      ctx.fillStyle = lightningFlash > 0 ? `rgba(20, 60, 90, ${lightningFlash})` : 'rgba(3, 8, 20, 0.32)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      if (lightningFlash > 0) lightningFlash -= 0.08;

      ctx.strokeStyle = '#00e5ff';
      ctx.lineWidth = 1.6;
      rainDrops.forEach(r => {
        if (mouse.x && Math.abs(mouse.x - r.x) < 80 && Math.abs(mouse.y - r.y) < 80) {
          r.x += (r.x > mouse.x ? 6 : -6);
        }
        ctx.beginPath();
        ctx.moveTo(r.x, r.y);
        ctx.lineTo(r.x - 2, r.y + r.l);
        ctx.stroke();
        r.y += r.speed;
        r.x -= 1.8;
        if (r.y > canvas.height) { r.y = -25; r.x = Math.random() * canvas.width; }
      });
    }

    /* 6. INTERACTIVE HYPERSPACE WARP TUNNEL */
    let warpStars = [];

    function initHyperspace() {
      warpStars = [];
      for (let i = 0; i < 500; i++) {
        warpStars.push({
          x: (Math.random() - 0.5) * canvas.width * 2,
          y: (Math.random() - 0.5) * canvas.height * 2,
          z: Math.random() * canvas.width
        });
      }
    }

    function renderHyperspace() {
      ctx.fillStyle = 'rgba(2, 0, 8, 0.35)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      let cx = canvas.width / 2 + (mouse.x ? (mouse.x - canvas.width/2)*0.4 : 0);
      let cy = canvas.height / 2 + (mouse.y ? (mouse.y - canvas.height/2)*0.4 : 0);
      let currentSpeed = isLeftMouseDown ? 55 : 22;

      warpStars.forEach(s => {
        s.z -= currentSpeed;
        if (s.z <= 0) { 
          s.z = canvas.width; 
          s.x = (Math.random() - 0.5) * canvas.width * 2; 
          s.y = (Math.random() - 0.5) * canvas.height * 2; 
        }
        let k = 250 / s.z;
        let px = s.x * k + cx; let py = s.y * k + cy;
        ctx.strokeStyle = (s.z % 3 === 0) ? '#ff00aa' : '#9d00ff';
        ctx.lineWidth = Math.min(4.5, (1 - s.z / canvas.width) * 5.5);
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(px + (px - cx) * (isLeftMouseDown ? 0.4 : 0.15), py + (py - cy) * (isLeftMouseDown ? 0.4 : 0.15));
        ctx.stroke();
      });
    }

    /* 7. INTERACTIVE ARCADE VAPORWAVE */
    let polyhedra = [];

    function initVapor() {
      polyhedra = [];
      for (let i = 0; i < 28; i++) {
        polyhedra.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 1.5,
          vy: Math.random() * 0.8 + 0.3,
          rot: Math.random() * Math.PI,
          rotSpeed: (Math.random() - 0.5) * 0.03,
          size: Math.random() * 32 + 20
        });
      }
    }

    function renderVapor() {
      ctx.fillStyle = 'rgba(12, 0, 25, 0.25)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      polyhedra.forEach(p => {
        p.rot += p.rotSpeed;
        p.y += p.vy;
        p.x += p.vx;

        if (mouse.x && Math.sqrt((mouse.x-p.x)**2 + (mouse.y-p.y)**2) < 140) {
          p.x += (p.x - mouse.x) * 0.04;
          p.y += (p.y - mouse.y) * 0.04;
        }

        if (p.y > canvas.height + 60) p.y = -60;
        if (p.x > canvas.width + 60) p.x = -60;
        if (p.x < -60) p.x = canvas.width + 60;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.strokeStyle = '#ff71ce';
        ctx.lineWidth = 2;
        ctx.strokeRect(-p.size/2, -p.size/2, p.size, p.size);
        ctx.strokeStyle = '#01cdfe';
        ctx.strokeRect(-p.size/3, -p.size/3, p.size/1.5, p.size/1.5);
        ctx.restore();
      });
    }

    /* THEME CLICK INTERACTIONS */
    function handleThemeMouseDown(e) {
      if (activeTheme === 'matrix') {
        matrixExplosions.push({ x: e.x, y: e.y, r: 10, alpha: 1 });
      } else if (activeTheme === 'synthwave') {
        synthLasers.push({ x: e.x, y: canvas.height });
      } else if (activeTheme === 'blackhole') {
        plasmaBeams.push({ angle: Math.random() * Math.PI * 2, width: 12, alpha: 1 });
      } else if (activeTheme === 'cyberpunk') {
        lightningFlash = 0.8;
      } else if (activeTheme === 'vapor') {
        polyhedra.forEach(p => {
          let dx = p.x - e.x; let dy = p.y - e.y;
          let dist = Math.sqrt(dx*dx + dy*dy);
          if (dist < 200) {
            p.vx += (dx / dist) * 12;
            p.vy += (dy / dist) * 12;
          }
        });
      }
    }

    /* MASTER ANIMATION LOOP */
    function masterRenderLoop() {
      requestAnimationFrame(masterRenderLoop);
      if (activeTheme === 'dynamic') renderDynamic();
      else if (activeTheme === 'matrix') renderMatrix();
      else if (activeTheme === 'synthwave') renderSynthwave();
      else if (activeTheme === 'blackhole') renderBlackhole();
      else if (activeTheme === 'cyberpunk') renderCyberpunk();
      else if (activeTheme === 'hyperspace') renderHyperspace();
      else if (activeTheme === 'vapor') renderVapor();
    }

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initParticles();
      if (activeTheme === 'matrix') initMatrix();
      if (activeTheme === 'synthwave') initSynthwave();
      if (activeTheme === 'blackhole') initBlackhole();
      if (activeTheme === 'cyberpunk') initCyberpunk();
      if (activeTheme === 'hyperspace') initHyperspace();
      if (activeTheme === 'vapor') initVapor();
    });

    initParticles();
    masterRenderLoop();
  </script>
</body>
</html>
